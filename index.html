<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Angkatan Ksatiara 12</title>
    <style>
        /* --- TEMA LATAR BELAKANG --- */
        body {
            background-color: #1a252f;
            background-image: radial-gradient(circle at center, #2c3e50 0%, #111820 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden; color: #ecf0f1;
        }
        
        /* --- TAMPILAN AWAL (INTRO SCREEN) --- */
        #intro-screen {
            text-align: center;
            max-width: 700px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-title { 
            font-size: 3em; 
            margin-bottom: 10px; 
            letter-spacing: 2px; 
            color: #fdfaf6; 
            text-shadow: 0px 4px 15px rgba(0,0,0,0.6);
            font-weight: 800;
        }

        .quote { 
            font-size: 1.2em; 
            font-style: italic; 
            color: #bdc3c7; 
            line-height: 1.6;
            margin-bottom: 40px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }
        .quote span { color: #e74c3c; font-weight: bold; }

        /* --- ANIMASI LOADING --- */
        #loading-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .spinner {
            width: 50px; height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top-color: #e74c3c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        .loading-text {
            font-size: 16px;
            letter-spacing: 1px;
            color: #ecf0f1;
            animation: pulse 1.5s infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        
        /* --- TOMBOL MULAI --- */
        #start-btn {
            padding: 16px 32px; font-size: 18px; font-weight: bold; cursor: pointer;
            background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; 
            border: none; border-radius: 30px; display: none;
            transition: all 0.3s ease; box-shadow: 0 8px 20px rgba(231,76,60,0.4);
            letter-spacing: 1px; text-transform: uppercase;
        }
        #start-btn:hover { 
            transform: translateY(-4px) scale(1.02); 
            box-shadow: 0 12px 25px rgba(231,76,60,0.6); 
        }
        
        /* --- WRAPPER BUKU & PENGATURAN MODE HALAMAN --- */
        #book-wrapper { 
            display: none; margin-top: 20px; width: 90vw; max-width: 950px; 
            transition: max-width 0.4s ease-in-out;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7); 
        }
        #book-wrapper.single-mode { max-width: 450px; }
        
        /* --- EFEK BUKU REALISTIS --- */
        .page { 
            background-color: #fdfaf6; border: 1px solid #999; 
            cursor: grab; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .page:active { cursor: grabbing; }
        canvas { width: 100%; height: 100%; object-fit: fill; }
        
        .stf__item.--left .page { box-shadow: inset -15px 0 30px rgba(0,0,0,0.15) !important; }
        .stf__item.--right .page { box-shadow: inset 15px 0 30px rgba(0,0,0,0.15) !important; }
        .stf__item.--flipping .page { box-shadow: inset 0 0 20px rgba(0,0,0,0.2) !important; }

        /* --- KONTROL TOMBOL BAWAH --- */
        .controls { display: none; margin-top: 30px; gap: 10px; flex-wrap: wrap; justify-content: center; padding-bottom: 40px; }
        .controls button { 
            padding: 10px 18px; border: none; border-radius: 6px; 
            background: rgba(255,255,255,0.1); color: white; cursor: pointer; font-weight: bold;
            border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(5px);
            transition: 0.2s;
        }
        .controls button:hover { background: rgba(255,255,255,0.25); transform: translateY(-2px); }
        
        #layout-toggle { background: #2980b9; border-color: #2980b9; }
        #layout-toggle:hover { background: #1a5276; }
        #music-btn { background: #d35400; border-color: #d35400; }
        #music-btn:hover { background: #a04000; }
    </style>
</head>
<body>

    <!-- LAYAR INTRODUKSI AWAL -->
    <div id="intro-screen">
        <h1 class="main-title">Ksatiara 12</h1>
        <p class="quote">
            "Dua puluh dua bulan. Waktu yang cukup panjang untuk mengukir cerita dari rumah kita.<br>
            <span>Selamat datang di mesin waktu kita.</span>"
        </p>

        <!-- Bagian Animasi Loading -->
        <div id="loading-section">
            <div class="spinner"></div>
            <div class="loading-text">Menyusun memori 22 purnama... ⏳</div>
        </div>

        <!-- Tombol ini muncul setelah PDF selesai dimuat -->
        <button id="start-btn">📖 Buka Kenangan & Putar Lagu</button>
    </div>

    <!-- AREA BUKU (Muncul setelah tombol ditekan) -->
    <div id="book-wrapper">
        <div id="flipbook"></div>
    </div>

    <!-- KONTROL NAVIGASI -->
    <div class="controls" id="controls">
        <button id="prev-btn">⬅️ Balik Kiri</button>
        <button id="layout-toggle">📄 Tampilan: 2 Halaman</button>
        <button id="music-btn">⏸️ Pause Musik</button>
        <button id="next-btn">Balik Kanan ➡️</button>
    </div>

    <!-- AUDIO PLAYER -->
    <audio id="bg-music" src="music.mp3.mp3" loop preload="auto"></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
            const pdfUrl = 'bukang_compressed.pdf'; 

            const introScreen = document.getElementById('intro-screen');
            const loadingSection = document.getElementById('loading-section');
            const startBtn = document.getElementById('start-btn');
            
            const flipbookEl = document.getElementById('flipbook');
            const bookWrapper = document.getElementById('book-wrapper');
            const controls = document.getElementById('controls');
            const bgMusic = document.getElementById('bg-music');
            const layoutToggleBtn = document.getElementById('layout-toggle');

            bgMusic.volume = 0.5;
            let isSingleMode = false; 
            let pageFlip; 

            try {
                // Membaca dokumen PDF
                const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
                const totalPages = pdf.numPages;

                for (let i = 1; i <= totalPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 1.5 }); 

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;

                    await page.render({ canvasContext: context, viewport: viewport }).promise;

                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    pageDiv.appendChild(canvas);
                    flipbookEl.appendChild(pageDiv);
                }

                // Matikan Animasi Loading, Tampilkan Tombol Mulai
                loadingSection.style.display = 'none';
                startBtn.style.display = 'inline-block';

                // Inisialisasi Buku
                pageFlip = new St.PageFlip(flipbookEl, {
                    width: 450, 
                    height: 636, 
                    size: "stretch",
                    minWidth: 315,
                    maxWidth: 1000,
                    minHeight: 420,
                    maxHeight: 1350,
                    showCover: true, 
                    mobileScrollSupport: false 
                });

                // Ketika Tombol Mulai Ditekan
                startBtn.addEventListener('click', () => {
                    // Sembunyikan layar intro
                    introScreen.style.display = 'none';
                    
                    // Tampilkan buku dan kontrol
                    bookWrapper.style.display = 'block';
                    controls.style.display = 'flex';

                    pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                    // Putar Musik
                    bgMusic.play().catch(function(error) {
                        console.log("Musik error: ", error);
                        alert("Ups, musik gagal diputar. Pastikan file 'music.mp3.mp3' ter-upload dengan benar.");
                    });
                });

                // Logika Tombol Mode 1/2 Halaman
                layoutToggleBtn.addEventListener('click', () => {
                    isSingleMode = !isSingleMode;
                    
                    if (isSingleMode) {
                        bookWrapper.classList.add('single-mode');
                        layoutToggleBtn.innerText = '📖 Tampilan: 1 Halaman';
                    } else {
                        bookWrapper.classList.remove('single-mode');
                        layoutToggleBtn.innerText = '📄 Tampilan: 2 Halaman';
                    }

                    setTimeout(() => { window.dispatchEvent(new Event('resize')); }, 100);
                    setTimeout(() => { window.dispatchEvent(new Event('resize')); pageFlip.update(); }, 400);
                });

                // Kontrol Balik Halaman & Pause/Play Musik
                document.getElementById('prev-btn').addEventListener('click', () => pageFlip.flipPrev());
                document.getElementById('next-btn').addEventListener('click', () => pageFlip.flipNext());
                
                document.getElementById('music-btn').addEventListener('click', (e) => {
                    if (bgMusic.paused) { 
                        bgMusic.play().catch(console.error); 
                        e.target.innerText = '⏸️ Pause Musik';
                    } else { 
                        bgMusic.pause(); 
                        e.target.innerText = '▶️ Putar Musik';
                    }
                });

            } catch (error) {
                loadingSection.innerHTML = '<p style="color:#e74c3c; font-weight:bold;">❌ Gagal memuat buku. Pastikan file PDF sudah benar.</p>';
                console.error(error);
            }
        });
    </script>
</body>
</html>
