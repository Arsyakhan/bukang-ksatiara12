<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Ksatiara 12">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#e3f2fd">

    <!-- Preview saat link dibagikan (WhatsApp, Telegram, dll.) -->
    <meta property="og:title" content="Buku Angkatan Ksatiara 12">
    <meta property="og:description" content="22 Purnama: Cerita dari Rumah Kita - Rumah Kepemimpinan">
    <meta property="og:type" content="website">
    <meta property="og:image" content="icon-512.png">

    <!-- PWA Manifest & Ikon -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="icon-192.png">

    <title>Buku Angkatan Ksatiara 12</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* --- TEMA DASAR --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root { --pad-top: 10px; --pad-bottom: 78px; }
        html { height: 100%; touch-action: pan-x pan-y; }
        body {
            background: linear-gradient(135deg, #e3f2fd 0%, #fff9c4 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; height: 100dvh;
            margin: 0; padding: var(--pad-top) 0 var(--pad-bottom);
            font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
            overflow: hidden;
            color: #2c3e50;
            overscroll-behavior: contain;
            touch-action: pan-x pan-y; /* pinch ditangani oleh JavaScript, bukan browser */
        }
        body.zoomed { overflow: auto; height: auto; min-height: 100vh; min-height: 100dvh; }

        /* Pengukur area aman (poni/notch) untuk mode aplikasi */
        #safe-probe {
            position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
            padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        }

        /* --- LOADING SCREEN --- */
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #e3f2fd 0%, #fff9c4 100%);
            z-index: 9999;
            transition: opacity 1s ease-in-out;
        }
        #loading-logo { width: 150px; max-width: 40vw; animation: pulse-logo 2s infinite ease-in-out; }
        @keyframes pulse-logo {
            0%   { transform: scale(1);   filter: drop-shadow(0 0 10px rgba(25, 118, 210, 0.2)); }
            50%  { transform: scale(1.1); filter: drop-shadow(0 0 25px rgba(25, 118, 210, 0.6)); }
            100% { transform: scale(1);   filter: drop-shadow(0 0 10px rgba(25, 118, 210, 0.2)); }
        }

        /* --- LOGO POJOK KIRI BAWAH --- */
        #brand-logo {
            display: none; position: fixed;
            left: calc(24px + env(safe-area-inset-left, 0px));
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            width: 110px; opacity: 0.9; pointer-events: none; z-index: 50;
        }
        @media (max-width: 900px) { #brand-logo { display: none !important; } }

        /* --- STAGE: ZOOM > GESER (cover ke tengah) > BUKU --- */
        #zoom-stage { display: none; position: relative; flex: none; margin: auto; }
        #zoomer { transform-origin: top left; width: max-content; }
        #book-shift {
            position: relative;
            transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .no-anim, .no-anim * { transition: none !important; }

        #book-wrapper { display: none; position: relative; z-index: 1; }

        #book-shadow {
            position: absolute; top: 0; bottom: 0; left: 0; width: 100%;
            border-radius: 3px; box-shadow: 0 10px 40px rgba(0,0,0,0.18);
            transition: left 0.45s ease, width 0.45s ease; z-index: 0; pointer-events: none;
        }
        .st-first #book-shadow { left: 50%; width: 50%; }
        .st-last  #book-shadow { left: 0;   width: 50%; }

        .edge { position: absolute; top: 4px; bottom: 0; width: 0; z-index: 1; pointer-events: none; transition: width 0.45s ease; }
        #edge-right {
            left: 100%; border-radius: 0 3px 3px 0;
            background: repeating-linear-gradient(to right, #ffffff 0 1px, #c9c9c9 1px 2px);
            box-shadow: 2px 2px 6px rgba(0,0,0,0.18);
        }
        #edge-left {
            right: 100%; border-radius: 3px 0 0 3px;
            background: repeating-linear-gradient(to left, #ffffff 0 1px, #c9c9c9 1px 2px);
            box-shadow: -2px 2px 6px rgba(0,0,0,0.18);
        }

        .page {
            background-color: #ffffff; border: 1px solid #e0e0e0;
            cursor: grab; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .page:active { cursor: grabbing; }
        canvas { display: block; width: 100%; height: 100%; object-fit: fill; }

        .stf__item.--left  .page { box-shadow: inset -15px 0 30px rgba(0,0,0,0.04) !important; }
        .stf__item.--right .page { box-shadow: inset 15px 0 30px rgba(0,0,0,0.04) !important; }

        /* --- PANAH MERAH DI TEPI BUKU --- */
        .nav-arrow {
            position: absolute; bottom: 14px; width: 38px; height: 38px; border-radius: 50%;
            border: none; background: #e0574f; color: #fff; font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 20;
            box-shadow: 0 3px 10px rgba(224, 87, 79, 0.45);
            transition: transform 0.15s;
        }
        .nav-arrow:hover { transform: scale(1.1); }
        .nav-arrow.hidden { display: none; }
        .flip-x { transform: scaleX(-1); }
        #nav-next { left: calc(100% + 26px); }
        #nav-prev { right: calc(100% + 26px); }
        .arrows-inside #nav-next { left: auto; right: 10px; }
        .arrows-inside #nav-prev { right: auto; left: 10px; }
        body.zoomed .nav-arrow { display: none; }

        /* --- SLIDER BAWAH + PRATINJAU HALAMAN --- */
        #bottom-bar {
            position: fixed; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
            width: min(840px, 80vw); display: none; z-index: 100;
        }
        @media (max-height: 500px) { #bottom-bar { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); } }
        #slider-track {
            position: relative; height: 8px; margin: 10px 0; border-radius: 8px;
            background: rgba(45, 52, 54, 0.18); cursor: pointer; touch-action: none;
        }
        #slider-track::before { content: ''; position: absolute; left: 0; right: 0; top: -14px; bottom: -14px; }
        #slider-thumb {
            position: absolute; top: 0; left: 0; height: 100%; width: 12%; border-radius: 8px;
            background: rgba(45, 52, 54, 0.72); transition: left 0.25s ease; pointer-events: none;
        }
        #bottom-bar.dragging #slider-thumb { transition: none; }

        #slider-preview {
            position: absolute; bottom: 30px; left: 0; transform: translateX(-50%);
            display: none; flex-direction: column; align-items: center; pointer-events: none;
        }
        #slider-preview.show { display: flex; }
        .pv-card {
            position: relative; display: flex; gap: 2px; padding: 6px;
            background: rgba(99, 110, 114, 0.92); border-radius: 6px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }
        .pv-card::after {
            content: ''; position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%);
            border: 7px solid transparent; border-top-color: rgba(99, 110, 114, 0.92); border-bottom: 0;
        }
        .pv-card canvas { background: #fff; }
        .pv-label {
            margin-top: 10px; padding: 2px 10px; border-radius: 4px;
            background: rgba(99, 110, 114, 0.92); color: #fff; font-weight: 700; font-size: 14px;
        }

        /* --- TOOLBAR KARTU PUTIH (pojok kanan atas) --- */
        #top-tools {
            position: fixed;
            top: calc(12px + env(safe-area-inset-top, 0px));
            right: calc(12px + env(safe-area-inset-right, 0px));
            max-width: calc(100vw - 24px);
            display: none; flex-wrap: wrap; justify-content: flex-end; gap: 10px; z-index: 100;
            padding: 8px 10px; background: #fff; border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        }
        .tool-btn {
            width: 34px; height: 34px; border-radius: 50%; border: none; color: #fff;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 15px; transition: transform 0.15s, opacity 0.2s;
        }
        .tool-btn:hover { transform: scale(1.1); }
        .tool-btn.off { opacity: 0.45; }
        .bg-red { background: #e0574f; } .bg-blue { background: #5aa9d6; }
        .bg-teal { background: #2fbfa8; } .bg-dark { background: #3b4a5c; }
        .bg-purple { background: #8e6bd1; } .bg-orange { background: #f2994a; }
        .bg-pink { background: #e8629a; } .bg-green { background: #43a047; }
        #music-btn.playing { box-shadow: 0 0 0 3px rgba(232, 98, 154, 0.35); }
        @media (max-width: 480px) {
            #top-tools { gap: 6px; padding: 6px 8px; }
            .tool-btn { width: 32px; height: 32px; font-size: 14px; }
        }

        /* --- POPUP (share & install) --- */
        .modal {
            display: none; position: fixed; inset: 0; z-index: 10000;
            background: rgba(0,0,0,0.4); align-items: center; justify-content: center; padding: 16px;
        }
        .modal.open { display: flex; }
        .modal-card {
            position: relative; width: min(92vw, 380px); background: #fff; border-radius: 16px;
            padding: 22px 20px 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.25);
        }
        .modal-card h3 { margin: 0 0 16px; font-size: 18px; }
        .modal-close {
            position: absolute; top: 10px; right: 12px; border: none; background: none;
            font-size: 26px; line-height: 1; cursor: pointer; color: #636e72;
        }
        .how-to { margin: 0; padding-left: 20px; line-height: 1.7; font-size: 14px; }
        .share-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
        .share-item {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            text-decoration: none; color: #2c3e50; font-size: 12px; font-weight: 700;
            background: none; border: none; cursor: pointer; font-family: inherit;
        }
        .share-item span {
            width: 44px; height: 44px; border-radius: 50%; color: #fff; font-size: 20px;
            display: flex; align-items: center; justify-content: center;
        }
        .share-page { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 12px; flex-wrap: wrap; }
        .share-page input[type="number"] { width: 70px; padding: 4px 6px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; }
        .share-link { display: flex; gap: 8px; }
        .share-link input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; font-size: 13px; }
        .share-link button {
            border: none; background: #e0574f; color: #fff; font-weight: 700; font-family: inherit;
            padding: 0 14px; border-radius: 8px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="safe-probe"></div>

    <!-- SCREEN LOADING -->
    <div id="welcome-screen">
        <img src="logo_rk.png" alt="Logo Rumah Kepemimpinan" id="loading-logo">
    </div>

    <!-- LOGO POJOK KIRI BAWAH -->
    <img src="logo_rk.png" alt="Rumah Kepemimpinan" id="brand-logo">

    <!-- BUKU: zoom > geser > buku (elemen #flipbook dibuat oleh JavaScript) -->
    <div id="zoom-stage">
        <div id="zoomer">
            <div id="book-shift" class="st-mid">
                <div id="book-shadow"></div>
                <div class="edge" id="edge-left"></div>
                <div class="edge" id="edge-right"></div>
                <div id="book-wrapper"></div>
                <button class="nav-arrow" id="nav-prev" aria-label="Halaman sebelumnya"><i class="fa-solid fa-play flip-x"></i></button>
                <button class="nav-arrow" id="nav-next" aria-label="Halaman berikutnya"><i class="fa-solid fa-play"></i></button>
            </div>
        </div>
    </div>

    <!-- SLIDER + PRATINJAU HALAMAN -->
    <div id="bottom-bar">
        <div id="slider-preview">
            <div class="pv-card" id="pv-card"></div>
            <div class="pv-label" id="pv-label">1</div>
        </div>
        <div id="slider-track" role="slider" aria-label="Geser halaman" aria-valuemin="1" aria-valuenow="1">
            <div id="slider-thumb"></div>
        </div>
    </div>

    <!-- TOOLBAR -->
    <div id="top-tools">
        <button class="tool-btn bg-red" id="share-btn" title="Bagikan" aria-label="Bagikan"><i class="fa-solid fa-share-nodes"></i></button>
        <button class="tool-btn bg-blue" id="print-btn" title="Cetak / unduh PDF" aria-label="Cetak atau unduh PDF"><i class="fa-solid fa-print"></i></button>
        <button class="tool-btn bg-teal" id="zoom-btn" title="Perbesar" aria-label="Perbesar"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
        <button class="tool-btn bg-dark" id="fullscreen-btn" title="Layar penuh" aria-label="Layar penuh"><i class="fa-solid fa-expand"></i></button>
        <button class="tool-btn bg-purple" id="view-btn" title="Tampilan 1 halaman" aria-label="Ganti tampilan 1 atau 2 halaman"><i class="fa-solid fa-file"></i></button>
        <button class="tool-btn bg-orange" id="sound-btn" title="Suara balik halaman" aria-label="Suara balik halaman"><i class="fa-solid fa-volume-high"></i></button>
        <button class="tool-btn bg-pink" id="music-btn" title="Musik" aria-label="Musik"><i class="fa-solid fa-music"></i></button>
        <button class="tool-btn bg-green" id="install-btn" title="Pasang sebagai aplikasi" aria-label="Pasang sebagai aplikasi" style="display:none"><i class="fa-solid fa-mobile-screen-button"></i></button>
    </div>

    <!-- POPUP SHARE -->
    <div class="modal" id="share-modal">
        <div class="modal-card">
            <button class="modal-close" aria-label="Tutup">&times;</button>
            <h3>Bagikan buku ini</h3>
            <div class="share-grid">
                <a class="share-item" id="sh-wa" target="_blank" rel="noopener"><span style="background:#25d366"><i class="fa-brands fa-whatsapp"></i></span>WhatsApp</a>
                <a class="share-item" id="sh-tg" target="_blank" rel="noopener"><span style="background:#229ed9"><i class="fa-brands fa-telegram"></i></span>Telegram</a>
                <a class="share-item" id="sh-fb" target="_blank" rel="noopener"><span style="background:#1877f2"><i class="fa-brands fa-facebook-f"></i></span>Facebook</a>
                <a class="share-item" id="sh-x" target="_blank" rel="noopener"><span style="background:#111"><i class="fa-brands fa-twitter"></i></span>X</a>
                <a class="share-item" id="sh-mail"><span style="background:#7f8c8d"><i class="fa-solid fa-envelope"></i></span>Email</a>
                <button class="share-item" id="sh-native" style="display:none"><span style="background:#e0574f"><i class="fa-solid fa-share-nodes"></i></span>Lainnya</button>
            </div>
            <label class="share-page">
                <input type="checkbox" id="share-with-page">
                Mulai dari halaman
                <input type="number" id="share-page-num" min="1" value="1">
            </label>
            <div class="share-link">
                <input type="text" id="share-url" readonly>
                <button id="share-copy">Salin</button>
            </div>
        </div>
    </div>

    <!-- POPUP CARA PASANG DI iPHONE/iPAD -->
    <div class="modal" id="install-modal">
        <div class="modal-card">
            <button class="modal-close" aria-label="Tutup">&times;</button>
            <h3>Pasang sebagai aplikasi</h3>
            <ol class="how-to">
                <li>Buka halaman ini di <b>Safari</b>.</li>
                <li>Ketuk tombol <b>Bagikan</b> <i class="fa-solid fa-arrow-up-from-bracket"></i> di layar.</li>
                <li>Pilih <b>Tambah ke Layar Utama</b> (Add to Home Screen).</li>
                <li>Ketuk <b>Tambah</b>. Ikon aplikasi akan muncul di layar utama.</li>
            </ol>
        </div>
    </div>

    <!-- AUDIO -->
    <audio id="bg-music" src="music.mp3.mp3" loop preload="auto"></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

    <script>
        // Tangkap prompt install sedini mungkin (bisa terjadi sebelum halaman selesai disiapkan)
        let deferredInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredInstallPrompt = e;
            document.dispatchEvent(new Event('install-available'));
        });

        // Cegah zoom bawaan Safari iOS (kita pakai pinch sendiri)
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev =>
            document.addEventListener(ev, (e) => e.preventDefault()));

        document.addEventListener("DOMContentLoaded", async () => {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
            const pdfUrl = 'bukang_compressed.pdf';
            const BOOK_TITLE = 'Buku Angkatan Ksatiara 12';

            // --- Pengaturan ---
            const IS_TOUCH = window.matchMedia('(pointer: coarse)').matches;
            const TARGET_WIDTH = IS_TOUCH ? 800 : 1000;      // lebar piksel canvas tiap halaman (zoom normal)
            const MAX_HI_WIDTH = IS_TOUCH ? 1800 : 2400;     // lebar maksimal saat di-zoom (lebih tajam)
            const THUMB_W = 160;
            const RENDER_RADIUS = 3;
            const KEEP_RADIUS = 8;
            const MAX_BOOK_WIDTH_TWO = 1000;
            const MAX_BOOK_WIDTH_ONE = 650;
            const THUMB_PCT = 12;
            const MAX_ZOOM = 4;

            const $ = (id) => document.getElementById(id);
            const root = document.documentElement;
            const welcomeScreen = $('welcome-screen');
            const brandLogo = $('brand-logo');
            const safeProbe = $('safe-probe');
            const zoomStage = $('zoom-stage');
            const zoomer = $('zoomer');
            const shift = $('book-shift');
            const bookWrapper = $('book-wrapper');
            const edgeLeft = $('edge-left');
            const edgeRight = $('edge-right');
            const navPrev = $('nav-prev');
            const navNext = $('nav-next');
            const bottomBar = $('bottom-bar');
            const sliderTrack = $('slider-track');
            const sliderThumb = $('slider-thumb');
            const sliderPreview = $('slider-preview');
            const pvCard = $('pv-card');
            const pvLabel = $('pv-label');
            const topTools = $('top-tools');
            const shareBtn = $('share-btn');
            const printBtn = $('print-btn');
            const zoomBtn = $('zoom-btn');
            const fullscreenBtn = $('fullscreen-btn');
            const viewBtn = $('view-btn');
            const soundBtn = $('sound-btn');
            const musicBtn = $('music-btn');
            const installBtn = $('install-btn');
            const bgMusic = $('bg-music');
            bgMusic.volume = 0.5;

            // --- State ---
            let pageFlip = null;
            let flipbookEl = null;
            let totalPages = 0;
            let currentZoom = 1;
            let currentPageNum = 1;
            let builtWidth = 0;
            let pageRatio = 0.707;
            let dragging = false;

            const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
            const setThumb = (ratio) => { sliderThumb.style.left = (ratio * (100 - THUMB_PCT)) + '%'; };
            const anyModalOpen = () => !!document.querySelector('.modal.open');

            // Mode tampilan: 2 = dua halaman, 1 = satu halaman (pilihan diingat)
            let viewMode = 2;
            try { if (localStorage.getItem('bukang_view_mode') === '1') viewMode = 1; } catch (e) {}

            // Suara balik halaman (pilihan diingat)
            let flipSoundOn = true;
            try { if (localStorage.getItem('bukang_flip_sound') === '0') flipSoundOn = false; } catch (e) {}

            // Fungsi yang diisi setelah PDF siap
            let flipForward = () => {};
            let flipBackward = () => {};
            let goToIndex = () => {};
            let onZoomSettled = () => {};

            // ---------- SUARA KERTAS ----------
            const flipAudio = new Audio('flip.mp3');
            flipAudio.preload = 'auto';
            let lastFlipSound = 0;
            const playFlipSound = (minGap = 150) => {
                if (!flipSoundOn) return;
                const now = Date.now();
                if (now - lastFlipSound < minGap) return;
                lastFlipSound = now;
                flipAudio.currentTime = 0;
                flipAudio.play().catch(() => {});
            };
            const updateSoundBtn = () => {
                soundBtn.innerHTML = flipSoundOn
                    ? '<i class="fa-solid fa-volume-high"></i>'
                    : '<i class="fa-solid fa-volume-xmark"></i>';
                soundBtn.classList.toggle('off', !flipSoundOn);
                soundBtn.title = flipSoundOn ? 'Matikan suara balik halaman' : 'Nyalakan suara balik halaman';
            };
            updateSoundBtn();
            soundBtn.addEventListener('click', () => {
                flipSoundOn = !flipSoundOn;
                try { localStorage.setItem('bukang_flip_sound', flipSoundOn ? '1' : '0'); } catch (e) {}
                updateSoundBtn();
            });

            // ---------- ZOOM ----------
            let zoomUiState = null;
            const applyZoom = () => {
                const zoomed = currentZoom > 1.01;
                document.body.classList.toggle('zoomed', zoomed);
                if (flipbookEl) flipbookEl.style.pointerEvents = zoomed ? 'none' : '';
                if (zoomed) {
                    zoomer.style.transform = `scale(${currentZoom})`;
                    zoomStage.style.width = `${shift.offsetWidth * currentZoom}px`;
                    zoomStage.style.height = `${shift.offsetHeight * currentZoom}px`;
                } else {
                    zoomer.style.transform = '';
                    zoomStage.style.width = '';
                    zoomStage.style.height = '';
                }
                if (zoomUiState !== zoomed) {
                    zoomUiState = zoomed;
                    zoomBtn.innerHTML = zoomed
                        ? '<i class="fa-solid fa-magnifying-glass-minus"></i>'
                        : '<i class="fa-solid fa-magnifying-glass-plus"></i>';
                    zoomBtn.title = zoomed ? 'Kembali normal' : 'Perbesar';
                }
                onZoomSettled(); // render ulang lebih tajam setelah zoom berhenti
            };

            // Zoom dengan menjaga titik (ax, ay) di konten tetap berada di posisi layar (sx, sy)
            const zoomAround = (newZoom, ax, ay, sx, sy) => {
                currentZoom = clamp(newZoom, 1, MAX_ZOOM);
                applyZoom();
                const r = zoomStage.getBoundingClientRect();
                window.scrollBy(r.left + ax * currentZoom - sx, r.top + ay * currentZoom - sy);
            };
            const zoomTo = (newZoom, sx, sy) => {
                const r = zoomStage.getBoundingClientRect();
                zoomAround(newZoom, (sx - r.left) / currentZoom, (sy - r.top) / currentZoom, sx, sy);
            };

            // Tombol zoom: normal <-> 2x
            zoomBtn.addEventListener('click', () => {
                zoomTo(currentZoom > 1.01 ? 1 : 2, window.innerWidth / 2, window.innerHeight / 2);
            });

            // ---------- PINCH (DUA JARI) DI HP ----------
            let pinch = null;
            let pinchBlock = false;
            const touchDist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
            const touchMid = (t) => ({ x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 });

            window.addEventListener('touchstart', (e) => {
                if (!pageFlip || anyModalOpen()) return;
                if (e.touches.length >= 2) {
                    pinchBlock = true;
                    e.stopPropagation(); // jangan sampai terbaca sebagai geseran balik halaman
                    const m = touchMid(e.touches);
                    const r = zoomStage.getBoundingClientRect();
                    pinch = {
                        d0: Math.max(touchDist(e.touches), 1),
                        z0: currentZoom,
                        ax: (m.x - r.left) / currentZoom,
                        ay: (m.y - r.top) / currentZoom
                    };
                }
            }, { capture: true, passive: false });

            window.addEventListener('touchmove', (e) => {
                if (!pinchBlock) return;
                e.stopPropagation();
                if (pinch && e.touches.length >= 2) {
                    if (e.cancelable) e.preventDefault();
                    const m = touchMid(e.touches);
                    zoomAround(pinch.z0 * touchDist(e.touches) / pinch.d0, pinch.ax, pinch.ay, m.x, m.y);
                }
            }, { capture: true, passive: false });

            const endTouch = (e) => {
                if (!pinchBlock) return;
                e.stopPropagation();
                if (e.touches.length < 2) pinch = null;
                if (e.touches.length === 0) {
                    pinchBlock = false;
                    if (currentZoom < 1.08 && currentZoom !== 1) { currentZoom = 1; applyZoom(); }
                }
            };
            window.addEventListener('touchend', endTouch, { capture: true });
            window.addEventListener('touchcancel', endTouch, { capture: true });

            // Trackpad pinch / Ctrl + scroll di laptop
            window.addEventListener('wheel', (e) => {
                if (!e.ctrlKey || !pageFlip) return;
                e.preventDefault();
                zoomTo(currentZoom * Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
                if (currentZoom < 1.03 && currentZoom !== 1) { currentZoom = 1; applyZoom(); }
            }, { passive: false });

            // ---------- MUSIK ----------
            const setMusicUI = (playing) => {
                musicBtn.innerHTML = playing
                    ? '<i class="fa-solid fa-pause"></i>'
                    : '<i class="fa-solid fa-music"></i>';
                musicBtn.classList.toggle('playing', playing);
            };
            setMusicUI(false);
            bgMusic.addEventListener('play', () => setMusicUI(true));
            bgMusic.addEventListener('pause', () => setMusicUI(false));
            musicBtn.addEventListener('click', () => {
                if (bgMusic.paused) { bgMusic.play().catch(() => {}); }
                else { bgMusic.pause(); }
            });

            const gestureEvents = ['click', 'touchend', 'keydown'];
            const removeGestureListeners = () =>
                gestureEvents.forEach(ev => document.removeEventListener(ev, startAudio));
            function startAudio() {
                if (!bgMusic.paused) { removeGestureListeners(); return; }
                bgMusic.play().then(removeGestureListeners).catch(() => {});
            }
            gestureEvents.forEach(ev => document.addEventListener(ev, startAudio));

            // ---------- FULLSCREEN ----------
            const reqFs = root.requestFullscreen || root.webkitRequestFullscreen;
            const getFsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
            const syncFsIcon = () => {
                fullscreenBtn.innerHTML = getFsEl()
                    ? '<i class="fa-solid fa-compress"></i>'
                    : '<i class="fa-solid fa-expand"></i>';
            };
            if (!reqFs) {
                fullscreenBtn.style.display = 'none';
            } else {
                fullscreenBtn.addEventListener('click', () => {
                    if (!getFsEl()) {
                        const p = reqFs.call(root);
                        if (p && p.catch) p.catch(() => {});
                    } else {
                        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                    }
                });
                document.addEventListener('fullscreenchange', syncFsIcon);
                document.addEventListener('webkitfullscreenchange', syncFsIcon);
            }

            // ---------- CETAK / UNDUH ----------
            printBtn.addEventListener('click', () => window.open(pdfUrl, '_blank'));

            // ---------- TOMBOL GANTI TAMPILAN ----------
            const updateViewBtn = () => {
                if (viewMode === 2) {
                    viewBtn.innerHTML = '<i class="fa-solid fa-file"></i>';
                    viewBtn.title = 'Tampilan 1 halaman';
                } else {
                    viewBtn.innerHTML = '<i class="fa-solid fa-book-open"></i>';
                    viewBtn.title = 'Tampilan 2 halaman';
                }
            };
            updateViewBtn();

            // ---------- PASANG SEBAGAI APLIKASI ----------
            const installModal = $('install-modal');
            const isStandalone = () =>
                window.matchMedia('(display-mode: standalone)').matches ||
                window.matchMedia('(display-mode: fullscreen)').matches ||
                window.navigator.standalone === true;
            const isIOS = () =>
                /iphone|ipad|ipod/i.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            const updateInstallBtn = () => {
                installBtn.style.display = (!isStandalone() && (deferredInstallPrompt || isIOS())) ? 'flex' : 'none';
            };
            updateInstallBtn();
            document.addEventListener('install-available', updateInstallBtn);
            window.addEventListener('appinstalled', () => { deferredInstallPrompt = null; updateInstallBtn(); });
            installBtn.addEventListener('click', async () => {
                if (deferredInstallPrompt) {
                    deferredInstallPrompt.prompt();
                    try { await deferredInstallPrompt.userChoice; } catch (e) {}
                    deferredInstallPrompt = null;
                    updateInstallBtn();
                } else if (isIOS()) {
                    installModal.classList.add('open');
                }
            });

            // ---------- POPUP: tutup lewat tombol X / klik latar / Escape ----------
            document.querySelectorAll('.modal').forEach(m => {
                m.addEventListener('click', (e) => { if (e.target === m) m.classList.remove('open'); });
            });
            document.querySelectorAll('.modal-close').forEach(b => {
                b.addEventListener('click', () => b.closest('.modal').classList.remove('open'));
            });

            // ---------- SHARE ----------
            const shareModal = $('share-modal');
            const shareUrl = $('share-url');
            const shareWithPage = $('share-with-page');
            const sharePageNum = $('share-page-num');
            const shareCopy = $('share-copy');
            const shareNative = $('sh-native');

            const baseUrl = () => location.href.split('#')[0];
            const buildShareUrl = () => {
                if (shareWithPage.checked) {
                    const n = clamp(parseInt(sharePageNum.value, 10) || 1, 1, totalPages || 9999);
                    return baseUrl() + '#page/' + n;
                }
                return baseUrl();
            };
            const refreshShare = () => {
                const url = buildShareUrl();
                shareUrl.value = url;
                const t = encodeURIComponent(BOOK_TITLE);
                const u = encodeURIComponent(url);
                $('sh-wa').href = `https://wa.me/?text=${t}%20${u}`;
                $('sh-tg').href = `https://t.me/share/url?url=${u}&text=${t}`;
                $('sh-fb').href = `https://www.facebook.com/sharer/sharer.php?u=${u}`;
                $('sh-x').href = `https://twitter.com/intent/tweet?url=${u}&text=${t}`;
                $('sh-mail').href = `mailto:?subject=${t}&body=${u}`;
            };
            shareBtn.addEventListener('click', () => {
                sharePageNum.value = currentPageNum;
                sharePageNum.max = totalPages || '';
                refreshShare();
                shareModal.classList.add('open');
            });
            shareWithPage.addEventListener('change', refreshShare);
            sharePageNum.addEventListener('input', () => { shareWithPage.checked = true; refreshShare(); });
            shareCopy.addEventListener('click', async () => {
                let ok = false;
                try { await navigator.clipboard.writeText(shareUrl.value); ok = true; }
                catch (e) {
                    try { shareUrl.select(); ok = document.execCommand('copy'); } catch (e2) {}
                }
                shareCopy.textContent = ok ? 'Tersalin ✓' : 'Gagal';
                setTimeout(() => { shareCopy.textContent = 'Salin'; }, 1500);
            });
            if (navigator.share) {
                shareNative.style.display = 'flex';
                shareNative.addEventListener('click', () => {
                    navigator.share({ title: BOOK_TITLE, url: buildShareUrl() }).catch(() => {});
                });
            }

            // ---------- KEYBOARD ----------
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && anyModalOpen()) {
                    document.querySelectorAll('.modal.open').forEach(m => m.classList.remove('open'));
                    return;
                }
                if (!pageFlip || anyModalOpen()) return;
                const tag = (e.target && e.target.tagName) || '';
                if (tag === 'INPUT' || tag === 'TEXTAREA') return;
                if (e.key === 'ArrowLeft') flipBackward();
                if (e.key === 'ArrowRight') flipForward();
            });

            navPrev.addEventListener('click', () => flipBackward());
            navNext.addEventListener('click', () => flipForward());

            try {
                // ---------- LOAD PDF ----------
                const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
                totalPages = pdf.numPages;

                const firstPage = await pdf.getPage(1);
                const baseViewport = firstPage.getViewport({ scale: 1 });
                const pageW = 450;
                const pageH = Math.round(pageW * baseViewport.height / baseViewport.width);
                pageRatio = pageW / pageH;

                const canvases = [];
                const pageEls = [];
                for (let i = 0; i < totalPages; i++) {
                    const canvas = document.createElement('canvas');
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    pageDiv.appendChild(canvas);
                    canvases.push(canvas);
                    pageEls.push(pageDiv);
                }

                // ---------- LOGIKA HALAMAN / SPREAD ----------
                // Mode 2 halaman: [0] cover, [1,2], [3,4], ... ; halaman terakhir sendiri jika jumlah halaman genap
                const spreadStart = (t) => viewMode === 2 ? (t <= 0 ? 0 : (t % 2 === 1 ? t : t - 1)) : t;
                const spreadPages = (start) => {
                    if (viewMode === 2) {
                        if (start === 0) return [0];
                        return start + 1 <= totalPages - 1 ? [start, start + 1] : [start];
                    }
                    return [start];
                };
                const spreadLabel = (start) => {
                    const p = spreadPages(start);
                    return p.length === 2 ? `${p[0] + 1} - ${p[1] + 1}` : `${p[0] + 1}`;
                };
                const nextIdx = (cur) => viewMode === 2 ? (cur === 0 ? 1 : cur + 2) : cur + 1;
                const prevIdx = (cur) => viewMode === 2 ? (cur <= 1 ? 0 : cur - 2) : cur - 1;
                const getState = (idx) => {
                    if (viewMode !== 2 || totalPages < 2) return 'mid';
                    if (idx <= 0) return 'first';
                    if (totalPages % 2 === 0 && idx >= totalPages - 1) return 'last';
                    return 'mid';
                };
                const isAtStart = (idx) => idx <= 0;
                const isAtEnd = (idx) => viewMode === 2
                    ? (idx === 0 ? totalPages <= 1 : Math.min(idx + 1, totalPages - 1) >= totalPages - 1)
                    : idx >= totalPages - 1;
                const currentIdx = () => {
                    try { return pageFlip ? pageFlip.getCurrentPageIndex() : 0; } catch (e) { return 0; }
                };

                // ---------- RENDER LAZY (lebih tajam saat di-zoom) ----------
                const renderedWidth = new Map(); // indeks halaman -> lebar piksel canvas saat ini
                const rendering = new Set();
                let updateToken = 0;
                const pause = (ms) => new Promise(r => setTimeout(r, ms));

                // Lebar render yang dibutuhkan: halaman yang terlihat dirender lebih besar saat di-zoom
                const desiredWidth = (idx) => {
                    if (currentZoom > 1.3 && spreadPages(spreadStart(currentIdx())).includes(idx)) {
                        const across = viewMode === 2 ? 2 : 1;
                        const pageCss = builtWidth / across;
                        const dpr = Math.min(window.devicePixelRatio || 1, 2);
                        return clamp(Math.round(pageCss * currentZoom * dpr), TARGET_WIDTH, MAX_HI_WIDTH);
                    }
                    return TARGET_WIDTH;
                };

                const renderPage = async (idx) => {
                    const targetW = desiredWidth(idx);
                    const cur = renderedWidth.get(idx);
                    if (rendering.has(idx) || (cur && Math.abs(cur - targetW) < 8)) return false;
                    rendering.add(idx);
                    try {
                        const page = await pdf.getPage(idx + 1);
                        const base = page.getViewport({ scale: 1 });
                        const viewport = page.getViewport({ scale: targetW / base.width });
                        // Render ke canvas sementara agar halaman tidak berkedip kosong
                        const off = document.createElement('canvas');
                        off.width = Math.floor(viewport.width);
                        off.height = Math.floor(viewport.height);
                        await page.render({ canvasContext: off.getContext('2d'), viewport }).promise;
                        const canvas = canvases[idx];
                        canvas.width = off.width;
                        canvas.height = off.height;
                        canvas.getContext('2d').drawImage(off, 0, 0);
                        renderedWidth.set(idx, off.width);
                        // Kalau kebutuhan berubah selama merender, ulangi
                        if (Math.abs(desiredWidth(idx) - off.width) > 8) scheduleUpdate(currentIdx(), 120);
                        return true;
                    } catch (err) {
                        console.error('Gagal render halaman', idx + 1, err);
                        return false;
                    } finally {
                        rendering.delete(idx);
                    }
                };

                const freePage = (idx) => {
                    canvases[idx].width = 0;
                    canvases[idx].height = 0;
                    renderedWidth.delete(idx);
                };

                const updateVisiblePages = async (center) => {
                    const token = ++updateToken;
                    for (const i of [...renderedWidth.keys()]) {
                        if (Math.abs(i - center) > KEEP_RADIUS) freePage(i);
                    }
                    const wanted = [center];
                    for (let d = 1; d <= RENDER_RADIUS; d++) wanted.push(center + d, center - d);
                    for (const i of wanted) {
                        if (token !== updateToken) return;
                        if (i >= 0 && i < totalPages) {
                            const did = await renderPage(i);
                            if (did) await pause(25);
                        }
                    }
                };

                let scheduleTimer;
                const scheduleUpdate = (center, delay = 250) => {
                    clearTimeout(scheduleTimer);
                    scheduleTimer = setTimeout(() => updateVisiblePages(center), delay);
                };
                onZoomSettled = () => scheduleUpdate(currentIdx(), 350);

                // ---------- THUMBNAIL (untuk pratinjau slider) ----------
                const thumbCache = new Map();
                const getThumb = (idx) => {
                    if (!thumbCache.has(idx)) {
                        thumbCache.set(idx, (async () => {
                            const page = await pdf.getPage(idx + 1);
                            const base = page.getViewport({ scale: 1 });
                            const vp = page.getViewport({ scale: THUMB_W / base.width });
                            const c = document.createElement('canvas');
                            c.width = Math.floor(vp.width);
                            c.height = Math.floor(vp.height);
                            await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
                            return c;
                        })().catch(() => { thumbCache.delete(idx); return null; }));
                    }
                    return thumbCache.get(idx);
                };

                const pvCanvases = [0, 1].map(() => {
                    const c = document.createElement('canvas');
                    c.width = THUMB_W;
                    c.height = Math.round(THUMB_W / pageRatio);
                    c.style.width = '80px';
                    c.style.height = Math.round(80 / pageRatio) + 'px';
                    pvCard.appendChild(c);
                    return c;
                });

                // Terapkan tampilan sesuai halaman: geser cover ke tengah, tumpukan halaman, panah, slider, link
                const applyBookState = (idx) => {
                    idx = clamp(idx, 0, totalPages - 1);
                    currentPageNum = idx + 1;
                    const state = getState(idx);

                    shift.classList.remove('st-first', 'st-last', 'st-mid');
                    shift.classList.add('st-' + state);
                    shift.style.transform = state === 'first' ? 'translateX(-25%)'
                                          : state === 'last'  ? 'translateX(25%)'
                                          : 'translateX(0)';

                    const ratio = totalPages > 1 ? idx / (totalPages - 1) : 0;
                    const maxT = Math.max(6, Math.min(14, builtWidth * 0.014));
                    edgeLeft.style.width = (ratio * maxT) + 'px';
                    edgeRight.style.width = ((1 - ratio) * maxT) + 'px';

                    navPrev.classList.toggle('hidden', isAtStart(idx));
                    navNext.classList.toggle('hidden', isAtEnd(idx));
                    const visibleW = state === 'mid' ? builtWidth : builtWidth / 2;
                    shift.classList.toggle('arrows-inside', (window.innerWidth - visibleW) / 2 < 80);

                    if (!dragging) setThumb(ratio);
                    sliderTrack.setAttribute('aria-valuenow', idx + 1);
                    sliderTrack.setAttribute('aria-valuemax', totalPages);
                    try { history.replaceState(null, '', '#page/' + (idx + 1)); } catch (e) {}
                };

                let syncTimer;
                const syncLater = () => {
                    clearTimeout(syncTimer);
                    syncTimer = setTimeout(() => applyBookState(currentIdx()), 1000);
                };

                // ---------- NAVIGASI ----------
                flipForward = () => {
                    if (!pageFlip) return;
                    const cur = currentIdx();
                    if (isAtEnd(cur)) return;
                    applyBookState(Math.min(nextIdx(cur), totalPages - 1));
                    pageFlip.flipNext();
                    syncLater();
                };
                flipBackward = () => {
                    if (!pageFlip) return;
                    const cur = currentIdx();
                    if (isAtStart(cur)) return;
                    applyBookState(Math.max(prevIdx(cur), 0));
                    pageFlip.flipPrev();
                    syncLater();
                };
                goToIndex = (t) => {
                    if (!pageFlip) return;
                    t = clamp(t, 0, totalPages - 1);
                    const target = spreadStart(t);
                    const cur = currentIdx();
                    if (target === cur) { applyBookState(cur); return; }
                    applyBookState(target);
                    if (nextIdx(cur) === target) pageFlip.flipNext();
                    else if (prevIdx(cur) === target) pageFlip.flipPrev();
                    else {
                        pageFlip.turnToPage(target);
                        playFlipSound();
                        scheduleUpdate(target, 150);
                    }
                    syncLater();
                };

                // ---------- UKURAN BUKU (selalu muat di layar, hormati poni/notch) ----------
                const computeBookWidth = () => {
                    const cs = getComputedStyle(safeProbe);
                    const sT = parseFloat(cs.paddingTop) || 0;
                    const sB = parseFloat(cs.paddingBottom) || 0;
                    const sL = parseFloat(cs.paddingLeft) || 0;
                    const sR = parseFloat(cs.paddingRight) || 0;
                    const padTop = 10 + sT;
                    const padBottom = (window.innerHeight < 500 ? 52 : 78) + sB;
                    root.style.setProperty('--pad-top', padTop + 'px');
                    root.style.setProperty('--pad-bottom', padBottom + 'px');

                    const across = viewMode === 2 ? 2 : 1;
                    const availW = (window.innerWidth - sL - sR) * 0.96;
                    const availH = window.innerHeight - padTop - padBottom;
                    const maxW = viewMode === 2 ? MAX_BOOK_WIDTH_TWO : MAX_BOOK_WIDTH_ONE;
                    return Math.max(120, Math.floor(Math.min(availW, availH * pageRatio * across, maxW)));
                };

                // ---------- BANGUN BUKU ----------
                const buildBook = (startIdx) => {
                    const w = computeBookWidth();
                    builtWidth = w;
                    bookWrapper.style.width = w + 'px';
                    shift.style.width = w + 'px';

                    if (pageFlip) {
                        try { pageFlip.destroy(); } catch (e) {}
                        pageFlip = null;
                    }
                    if (flipbookEl && flipbookEl.parentNode) flipbookEl.remove();

                    flipbookEl = document.createElement('div');
                    flipbookEl.id = 'flipbook';
                    bookWrapper.appendChild(flipbookEl);

                    pageEls.forEach(el => { el.className = 'page'; el.removeAttribute('style'); });

                    const single = viewMode === 1;
                    pageFlip = new St.PageFlip(flipbookEl, {
                        width: pageW, height: pageH, size: 'stretch',
                        minWidth: single ? Math.ceil(w * 0.6) : 60,
                        maxWidth: 1000,
                        minHeight: 80, maxHeight: 1600,
                        showCover: true,
                        usePortrait: single,
                        startPage: startIdx,
                        mobileScrollSupport: false,
                        flippingTime: 600,
                        maxShadowOpacity: 0.35,
                        showPageCorners: !IS_TOUCH
                    });
                    pageFlip.loadFromHTML(pageEls);

                    pageFlip.on('flip', (e) => {
                        applyBookState(e.data);
                        scheduleUpdate(e.data);
                        playFlipSound(1000);
                    });
                    pageFlip.on('changeState', (e) => {
                        if (e.data === 'flipping') playFlipSound();
                        if (e.data === 'read') applyBookState(currentIdx());
                    });

                    shift.classList.add('no-anim');
                    applyBookState(startIdx);
                    requestAnimationFrame(() => requestAnimationFrame(() => shift.classList.remove('no-anim')));

                    applyZoom();
                    requestAnimationFrame(applyZoom);
                    scheduleUpdate(startIdx, 50);
                };

                // ---------- PRATINJAU SLIDER ----------
                let previewToken = 0;
                const showPreview = (t, clientX) => {
                    const start = spreadStart(t);
                    const pages = spreadPages(start);
                    const token = ++previewToken;
                    pvLabel.textContent = spreadLabel(start);
                    pvCanvases.forEach((c, i) => {
                        if (pages[i] === undefined) { c.style.display = 'none'; return; }
                        c.style.display = 'block';
                        const ctx = c.getContext('2d');
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(0, 0, c.width, c.height);
                        getThumb(pages[i]).then(src => {
                            if (src && token === previewToken) ctx.drawImage(src, 0, 0, c.width, c.height);
                        });
                    });
                    sliderPreview.classList.add('show');
                    const barRect = bottomBar.getBoundingClientRect();
                    const half = sliderPreview.offsetWidth / 2;
                    const center = clamp(clientX, half + 8, window.innerWidth - half - 8);
                    sliderPreview.style.left = (center - barRect.left) + 'px';
                };
                const hidePreview = () => {
                    previewToken++;
                    sliderPreview.classList.remove('show');
                };

                const ratioFromX = (clientX) => {
                    const r = sliderTrack.getBoundingClientRect();
                    const thumbW = r.width * THUMB_PCT / 100;
                    return clamp((clientX - r.left - thumbW / 2) / (r.width - thumbW), 0, 1);
                };
                const targetFromRatio = (ratio) => Math.round(ratio * (totalPages - 1));

                const onSliderMove = (e) => {
                    const ratio = ratioFromX(e.clientX);
                    if (dragging) setThumb(ratio);
                    showPreview(targetFromRatio(ratio), e.clientX);
                };
                sliderTrack.addEventListener('pointerdown', (e) => {
                    if (!pageFlip) return;
                    dragging = true;
                    bottomBar.classList.add('dragging');
                    try { sliderTrack.setPointerCapture(e.pointerId); } catch (err) {}
                    onSliderMove(e);
                });
                sliderTrack.addEventListener('pointermove', (e) => {
                    if (!pageFlip) return;
                    if (dragging || e.pointerType === 'mouse') onSliderMove(e);
                });
                sliderTrack.addEventListener('pointerup', (e) => {
                    if (!dragging) return;
                    dragging = false;
                    bottomBar.classList.remove('dragging');
                    if (e.pointerType !== 'mouse') hidePreview();
                    goToIndex(targetFromRatio(ratioFromX(e.clientX)));
                });
                sliderTrack.addEventListener('pointercancel', () => {
                    dragging = false;
                    bottomBar.classList.remove('dragging');
                    hidePreview();
                    applyBookState(currentIdx());
                });
                sliderTrack.addEventListener('pointerleave', () => { if (!dragging) hidePreview(); });

                // ---------- HALAMAN AWAL DARI LINK (#page/N) ----------
                const parseHash = () => {
                    const m = /^#page\/(\d+)/.exec(location.hash);
                    return m ? parseInt(m[1], 10) : null;
                };
                const hashPage = parseHash();
                const startIdx = spreadStart(clamp((hashPage || 1) - 1, 0, totalPages - 1));

                await updateVisiblePages(startIdx);

                // Transisi loading -> buku
                setTimeout(() => {
                    welcomeScreen.style.opacity = 0;
                    setTimeout(() => {
                        welcomeScreen.style.display = 'none';
                        zoomStage.style.display = 'block';
                        bookWrapper.style.display = 'block';
                        buildBook(startIdx);

                        bottomBar.style.display = 'block';
                        topTools.style.display = 'flex';
                        brandLogo.style.display = 'block';
                    }, 1000);
                }, 1200);

                // ---------- EVENT ----------
                viewBtn.addEventListener('click', () => {
                    if (!pageFlip) return;
                    const cur = currentIdx();
                    viewMode = viewMode === 2 ? 1 : 2;
                    try { localStorage.setItem('bukang_view_mode', String(viewMode)); } catch (e) {}
                    updateViewBtn();
                    buildBook(spreadStart(cur));
                });

                window.addEventListener('hashchange', () => {
                    const n = parseHash();
                    if (n !== null && pageFlip) goToIndex(n - 1);
                });

                let resizeTimer;
                const onResize = () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => {
                        if (!pageFlip) return;
                        if (Math.abs(computeBookWidth() - builtWidth) > 2) buildBook(currentIdx());
                        else { applyZoom(); applyBookState(currentIdx()); }
                    }, 250);
                };
                window.addEventListener('resize', onResize);
                window.addEventListener('orientationchange', onResize);

            } catch (error) {
                welcomeScreen.innerHTML = '<div style="color: #e74c3c; font-weight: bold; text-align:center; padding: 20px;">PDF gagal dimuat. Pastikan file tersedia.</div>';
                console.error(error);
            }
        });

        // ---------- REGISTRASI PWA ----------
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('PWA aktif!', reg.scope))
                    .catch(err => console.log('PWA gagal: ', err));
            });
        }
    </script>
</body>
</html>
