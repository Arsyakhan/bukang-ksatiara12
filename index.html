<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Angkatan Ksatiara 12</title>
    <!-- Tambahan Library Icon FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- TEMA DASAR --- */
        body {
            background-color: #2c3e50;
            background-image: radial-gradient(circle, #34495e 0%, #111820 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden; color: #ecf0f1;
        }
        
        /* --- TAMPILAN AWAL (WELCOME SCREEN) --- */
        #welcome-screen {
            display: flex; flex-direction: column; align-items: center; text-align: center;
            padding: 20px; max-width: 700px;
            animation: fadeIn 1.5s ease-in-out;
        }
        
        .main-title { 
            font-size: 36px; color: #fdfaf6; letter-spacing: 2px; margin-bottom: 10px; 
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5); text-transform: uppercase;
        }
        
        .quote {
            font-size: 22px; font-style: italic; color: #f1c40f; margin-bottom: 15px;
            text-shadow: 0px 0px 15px rgba(241, 196, 15, 0.4); font-weight: 300;
        }
        
        .sub-quote {
            font-size: 16px; color: #bdc3c7; line-height: 1.6; margin-bottom: 40px;
        }

        #loader-area { display: flex; flex-direction: column; align-items: center; height: 80px; }
        .spinner {
            width: 45px; height: 45px; border: 4px solid rgba(255,255,255,0.1);
            border-left-color: #e74c3c; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        .loading-text { font-size: 14px; color: #95a5a6; letter-spacing: 1px; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        #start-btn {
            padding: 15px 35px; font-size: 18px; font-weight: bold; cursor: pointer;
            background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; 
            border: none; border-radius: 30px; display: none;
            transition: 0.3s; box-shadow: 0 5px 20px rgba(231,76,60,0.5);
            animation: pulse 2s infinite;
        }
        #start-btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 25px rgba(231,76,60,0.7); }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(231,76,60,0.7); }
            70% { box-shadow: 0 0 0 15px rgba(231,76,60,0); }
            100% { box-shadow: 0 0 0 0 rgba(231,76,60,0); }
        }

        /* --- BUKU --- */
        #book-wrapper { 
            display: none; margin-top: 20px; width: 90vw; max-width: 950px; 
            transition: max-width 0.4s ease-in-out;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); 
        }
        #book-wrapper.single-mode { max-width: 450px; }
        
        .page { 
            background-color: #fdfaf6; border: 1px solid #999; 
            cursor: grab; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .page:active { cursor: grabbing; }
        canvas { width: 100%; height: 100%; object-fit: fill; }
        
        .stf__item.--left .page { box-shadow: inset -15px 0 30px rgba(0,0,0,0.15) !important; }
        .stf__item.--right .page { box-shadow: inset 15px 0 30px rgba(0,0,0,0.15) !important; }
        .stf__item.--flipping .page { box-shadow: inset 0 0 20px rgba(0,0,0,0.2) !important; }

        /* --- UI/UX KONTROL BAWAH (BARU) --- */
        .controls { 
            display: none; 
            margin-top: 35px; 
            margin-bottom: 40px;
            gap: 15px; 
            flex-wrap: wrap; 
            justify-content: center; 
            align-items: center;
            /* Glassmorphism Effect */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 50px; /* Pill shape */
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .controls button { 
            padding: 10px 20px; 
            border: none; 
            border-radius: 30px; 
            background: transparent; 
            color: #bdc3c7; 
            cursor: pointer; 
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .controls button i { font-size: 18px; }

        .controls button:hover { 
            background: rgba(255, 255, 255, 0.15); 
            color: #ffffff;
            transform: translateY(-2px); 
        }

        /* Navigasi Kiri Kanan */
        #prev-btn, #next-btn { color: #3498db; }
        #prev-btn:hover, #next-btn:hover { background: rgba(52, 152, 219, 0.2); }
        
        /* Tombol Layout */
        #layout-toggle { color: #f1c40f; }
        #layout-toggle:hover { background: rgba(241, 196, 15, 0.2); }

        /* Tombol Musik (Aktif & Non-Aktif) */
        #music-btn.playing { color: #e74c3c; }
        #music-btn.playing:hover { background: rgba(231, 76, 60, 0.2); }
        #music-btn.paused { color: #95a5a6; }
        
        .divider { width: 1px; height: 24px; background: rgba(255, 255, 255, 0.2); margin: 0 5px; }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <h1 class="main-title">Ksatiara 12</h1>
        <div class="quote">"22 Purnama Cerita dari Rumah Kita..."</div>
        <div class="sub-quote">Dua puluh dua bulan. Waktu yang cukup panjang untuk mengukir memori, namun terasa begitu singkat saat harus diakhiri.<br>Selamat datang di mesin waktu kita.</div>
        
        <div id="loader-area">
            <div class="spinner"></div>
            <div class="loading-text">Menyiapkan Mesin Waktu... ⏳</div>
        </div>
        
        <button id="start-btn"><i class="fa-solid fa-book-open" style="margin-right: 8px;"></i> Buka Lembaran & Putar Lagu</button>
    </div>

    <div id="book-wrapper">
        <div id="flipbook"></div>
    </div>

    <!-- STRUKTUR KONTROL BARU -->
    <div class="controls" id="controls">
        <button id="prev-btn" title="Halaman Sebelumnya"><i class="fa-solid fa-chevron-left"></i> Kiri</button>
        
        <div class="divider"></div>
        
        <button id="layout-toggle" title="Ubah Tampilan Mode"><i class="fa-solid fa-book-open"></i> 2 Halaman</button>
        <button id="music-btn" class="playing" title="Matikan/Nyalakan Musik"><i class="fa-solid fa-pause"></i> Pause Musik</button>
        
        <div class="divider"></div>
        
        <button id="next-btn" title="Halaman Selanjutnya">Kanan <i class="fa-solid fa-chevron-right"></i></button>
    </div>

    <audio id="bg-music" src="music.mp3.mp3" loop preload="auto"></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
            const pdfUrl = 'bukang_compressed.pdf'; 

            const welcomeScreen = document.getElementById('welcome-screen');
            const loaderArea = document.getElementById('loader-area');
            const startBtn = document.getElementById('start-btn');
            const flipbookEl = document.getElementById('flipbook');
            const bookWrapper = document.getElementById('book-wrapper');
            const controls = document.getElementById('controls');
            const bgMusic = document.getElementById('bg-music');
            const layoutToggleBtn = document.getElementById('layout-toggle');
            const musicBtn = document.getElementById('music-btn');

            bgMusic.volume = 0.5;
            let isSingleMode = false; 
            let pageFlip; 

            try {
                const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
                const totalPages = pdf.numPages;

                for (let i = 1; i <= totalPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 1.5 }); 

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;

                    await page.render({ canvasContext: context, viewport: viewport }).promise;

                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    pageDiv.appendChild(canvas);
                    flipbookEl.appendChild(pageDiv);
                }

                loaderArea.style.display = 'none';
                startBtn.style.display = 'inline-block';

                pageFlip = new St.PageFlip(flipbookEl, {
                    width: 450, height: 636, size: "stretch",
                    minWidth: 315, maxWidth: 1000, minHeight: 420, maxHeight: 1350,
                    showCover: true, mobileScrollSupport: false 
                });

                startBtn.addEventListener('click', () => {
                    welcomeScreen.style.display = 'none';
                    bookWrapper.style.display = 'block';
                    controls.style.display = 'flex';

                    pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                    bgMusic.play().catch(function(error) {
                        console.log("Musik error: ", error);
                        alert("Ups, musik gagal diputar. Pastikan file 'music.mp3.mp3' ter-upload.");
                    });
                });

                // UPDATE LOGIKA TOMBOL LAYOUT DENGAN ICON
                layoutToggleBtn.addEventListener('click', () => {
                    isSingleMode = !isSingleMode;
                    if (isSingleMode) {
                        bookWrapper.classList.add('single-mode');
                        layoutToggleBtn.innerHTML = '<i class="fa-solid fa-file-lines"></i> 1 Halaman';
                    } else {
                        bookWrapper.classList.remove('single-mode');
                        layoutToggleBtn.innerHTML = '<i class="fa-solid fa-book-open"></i> 2 Halaman';
                    }
                    setTimeout(() => { window.dispatchEvent(new Event('resize')); }, 100);
                    setTimeout(() => { window.dispatchEvent(new Event('resize')); pageFlip.update(); }, 400);
                });

                document.getElementById('prev-btn').addEventListener('click', () => pageFlip.flipPrev());
                document.getElementById('next-btn').addEventListener('click', () => pageFlip.flipNext());
                
                // UPDATE LOGIKA TOMBOL MUSIK DENGAN ICON
                musicBtn.addEventListener('click', () => {
                    if (bgMusic.paused) { 
                        bgMusic.play().catch(console.error); 
                        musicBtn.innerHTML = '<i class="fa-solid fa-pause"></i> Pause Musik';
                        musicBtn.classList.add('playing');
                        musicBtn.classList.remove('paused');
                    } else { 
                        bgMusic.pause(); 
                        musicBtn.innerHTML = '<i class="fa-solid fa-play"></i> Play Musik';
                        musicBtn.classList.add('paused');
                        musicBtn.classList.remove('playing');
                    }
                });

            } catch (error) {
                loaderArea.innerHTML = '<div style="color: #e74c3c; font-weight: bold; margin-top: 20px;">❌ Gagal memuat buku PDF.</div>';
                console.error(error);
            }
        });
    </script>
</body>
</html>
