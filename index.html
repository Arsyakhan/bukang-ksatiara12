<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#e3f2fd">

    <!-- PWA Manifest & Ikon -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo_rk.png">
    <link rel="icon" type="image/png" href="logo_rk.png">

    <title>Buku Angkatan Ksatiara 12</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* --- TEMA DASAR --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root { --pad-top: 10px; --pad-bottom: 78px; }
        html { height: 100%; }
        body {
            background: linear-gradient(135deg, #e3f2fd 0%, #fff9c4 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; height: 100dvh;
            margin: 0; padding: var(--pad-top) 0 var(--pad-bottom);
            font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
            overflow: hidden; /* tidak ada scroll saat zoom normal -> tidak ada getaran/resize */
            color: #2c3e50;
            overscroll-behavior: contain;
        }
        /* Saat di-zoom, halaman boleh di-scroll */
        body.zoomed { overflow: auto; height: auto; min-height: 100vh; min-height: 100dvh; }

        /* --- LOADING SCREEN --- */
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #e3f2fd 0%, #fff9c4 100%);
            z-index: 9999;
            transition: opacity 1s ease-in-out;
        }
        #loading-logo {
            width: 150px; max-width: 40vw;
            animation: pulse-logo 2s infinite ease-in-out;
        }
        @keyframes pulse-logo {
            0%   { transform: scale(1);   filter: drop-shadow(0 0 10px rgba(25, 118, 210, 0.2)); }
            50%  { transform: scale(1.1); filter: drop-shadow(0 0 25px rgba(25, 118, 210, 0.6)); }
            100% { transform: scale(1);   filter: drop-shadow(0 0 10px rgba(25, 118, 210, 0.2)); }
        }

        /* --- STAGE ZOOM (supaya hasil zoom bisa di-scroll ke semua sisi) --- */
        #zoom-stage { position: relative; flex: none; margin: auto; }

        /* --- BUKU --- */
        #book-wrapper {
            display: none;
            transform-origin: top left;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            border-radius: 5px;
            z-index: 10;
        }
        .page {
            background-color: #ffffff; border: 1px solid #e0e0e0;
            cursor: grab; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .page:active { cursor: grabbing; }
        canvas { display: block; width: 100%; height: 100%; object-fit: fill; }

        .stf__item.--left  .page { box-shadow: inset -15px 0 30px rgba(0,0,0,0.04) !important; }
        .stf__item.--right .page { box-shadow: inset 15px 0 30px rgba(0,0,0,0.04) !important; }

        /* --- PANAH KIRI & KANAN --- */
        .side-nav {
            position: fixed; top: 50%; transform: translateY(-50%);
            width: 45px; height: 45px; border-radius: 50%;
            background-color: #e74c3c;
            color: white; border: none; font-size: 18px;
            align-items: center; justify-content: center;
            cursor: pointer; z-index: 100;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
            transition: opacity 0.2s, transform 0.2s; opacity: 0.8;
            display: none;
        }
        .side-nav:hover { opacity: 1; transform: translateY(-50%) scale(1.1); }
        #nav-left  { left: 2vw; }
        #nav-right { right: 2vw; }

        /* --- SLIDER BAWAH --- */
        #bottom-bar {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 400px;
            display: none; flex-direction: column; align-items: center;
            z-index: 100;
        }
        @media (max-height: 500px) { #bottom-bar { bottom: 10px; } }
        #page-tooltip {
            background-color: rgba(99, 110, 114, 0.9); color: white;
            padding: 4px 12px; border-radius: 12px; font-size: 14px; font-weight: 700;
            margin-bottom: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            pointer-events: none; transition: opacity 0.1s ease-out;
            opacity: 0;
        }
        @media (max-height: 500px) { #page-tooltip { position: absolute; bottom: 24px; margin: 0; } }
        #page-slider {
            width: 100%; -webkit-appearance: none; appearance: none;
            height: 6px; background: rgba(45, 52, 54, 0.2);
            border-radius: 10px; outline: none; cursor: pointer;
        }
        #page-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 18px; height: 18px; border-radius: 50%;
            background: #2d3436; cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        #page-slider::-moz-range-thumb {
            width: 18px; height: 18px; border-radius: 50%; border: none;
            background: #2d3436; cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        /* --- MENU KECIL POJOK ATAS --- */
        #top-tools {
            position: fixed; top: 10px; right: 10px;
            display: none; gap: 8px; z-index: 100;
        }
        .mini-btn {
            width: 35px; height: 35px; border-radius: 50%; border: none;
            background: rgba(255, 255, 255, 0.85);
            color: #2d3436; cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: background 0.2s; font-size: 14px;
        }
        .mini-btn:hover { background: white; }
        #music-btn.playing { color: #e74c3c; }
    </style>
</head>
<body>

    <!-- SCREEN LOADING -->
    <div id="welcome-screen">
        <img src="logo_rk.png" alt="Logo Rumah Kepemimpinan" id="loading-logo">
    </div>

    <!-- WADAH BUKU (elemen #flipbook dibuat oleh JavaScript) -->
    <div id="zoom-stage">
        <div id="book-wrapper"></div>
    </div>

    <!-- NAVIGASI -->
    <button class="side-nav" id="nav-left" aria-label="Halaman sebelumnya"><i class="fa-solid fa-chevron-left"></i></button>
    <button class="side-nav" id="nav-right" aria-label="Halaman berikutnya"><i class="fa-solid fa-chevron-right"></i></button>

    <!-- SLIDER -->
    <div id="bottom-bar">
        <div id="page-tooltip">1</div>
        <input type="range" id="page-slider" min="1" max="1" value="1" aria-label="Geser halaman">
    </div>

    <!-- TOMBOL POJOK KANAN ATAS -->
    <div id="top-tools">
        <button class="mini-btn" id="view-btn" title="Tampilan 1 halaman" aria-label="Ganti tampilan 1 atau 2 halaman"><i class="fa-solid fa-file"></i></button>
        <button class="mini-btn" id="zoom-out-btn" title="Perkecil" aria-label="Perkecil"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
        <button class="mini-btn" id="zoom-in-btn" title="Perbesar" aria-label="Perbesar"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
        <button class="mini-btn" id="fullscreen-btn" title="Layar penuh" aria-label="Layar penuh"><i class="fa-solid fa-expand"></i></button>
        <button class="mini-btn" id="music-btn" title="Musik" aria-label="Musik"><i class="fa-solid fa-music"></i></button>
    </div>

    <!-- AUDIO -->
    <audio id="bg-music" src="music.mp3.mp3" loop preload="auto"></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
            const pdfUrl = 'bukang_compressed.pdf';

            // --- Pengaturan ---
            const IS_TOUCH = window.matchMedia('(pointer: coarse)').matches;
            const TARGET_WIDTH = IS_TOUCH ? 800 : 1000; // lebar piksel canvas tiap halaman (lebih ringan di HP)
            const RENDER_RADIUS = 3;                    // render halaman di sekitar halaman aktif
            const KEEP_RADIUS = 8;                      // halaman lebih jauh dari ini dilepas dari memori
            const MAX_BOOK_WIDTH_TWO = 1000;            // lebar maksimal buku (mode 2 halaman)
            const MAX_BOOK_WIDTH_ONE = 650;             // lebar maksimal buku (mode 1 halaman)

            const welcomeScreen = document.getElementById('welcome-screen');
            const zoomStage = document.getElementById('zoom-stage');
            const bookWrapper = document.getElementById('book-wrapper');

            const navLeft = document.getElementById('nav-left');
            const navRight = document.getElementById('nav-right');
            const bottomBar = document.getElementById('bottom-bar');
            const topTools = document.getElementById('top-tools');
            const pageSlider = document.getElementById('page-slider');
            const pageTooltip = document.getElementById('page-tooltip');

            const viewBtn = document.getElementById('view-btn');
            const zoomInBtn = document.getElementById('zoom-in-btn');
            const zoomOutBtn = document.getElementById('zoom-out-btn');
            const musicBtn = document.getElementById('music-btn');
            const fullscreenBtn = document.getElementById('fullscreen-btn');

            const bgMusic = document.getElementById('bg-music');
            bgMusic.volume = 0.5;

            let pageFlip = null;
            let flipbookEl = null;
            let totalPages = 0;
            let tooltipTimeout;
            let currentZoom = 1;

            // Mode tampilan: 2 = dua halaman, 1 = satu halaman (pilihan diingat)
            let viewMode = 2;
            try { if (localStorage.getItem('bukang_view_mode') === '1') viewMode = 1; } catch (e) {}

            // ---------- SUARA KERTAS ----------
            const flipAudio = new Audio('flip.mp3');
            flipAudio.preload = 'auto';
            let lastFlipSound = 0;
            const playFlipSound = () => {
                const now = Date.now();
                if (now - lastFlipSound < 150) return; // cegah bunyi ganda
                lastFlipSound = now;
                flipAudio.currentTime = 0;
                flipAudio.play().catch(() => {});
            };

            // ---------- TOOLTIP ----------
            const updateTooltip = (val) => {
                pageTooltip.innerText = val;
                pageTooltip.style.opacity = 1;
                clearTimeout(tooltipTimeout);
                tooltipTimeout = setTimeout(() => { pageTooltip.style.opacity = 0; }, 1500);
            };

            // ---------- ZOOM (bisa di-scroll ke semua sisi) ----------
            const applyZoom = () => {
                document.body.classList.toggle('zoomed', currentZoom > 1);
                if (currentZoom > 1) {
                    bookWrapper.style.transform = `scale(${currentZoom})`;
                    zoomStage.style.width = `${bookWrapper.offsetWidth * currentZoom}px`;
                    zoomStage.style.height = `${bookWrapper.offsetHeight * currentZoom}px`;
                } else {
                    bookWrapper.style.transform = '';
                    zoomStage.style.width = '';
                    zoomStage.style.height = '';
                }
            };

            // ---------- MUSIK (ikon selalu mengikuti status audio sebenarnya) ----------
            const setMusicUI = (playing) => {
                musicBtn.innerHTML = playing
                    ? '<i class="fa-solid fa-pause"></i>'
                    : '<i class="fa-solid fa-music"></i>';
                musicBtn.classList.toggle('playing', playing);
            };
            setMusicUI(false);
            bgMusic.addEventListener('play', () => setMusicUI(true));
            bgMusic.addEventListener('pause', () => setMusicUI(false));

            musicBtn.addEventListener('click', () => {
                if (bgMusic.paused) { bgMusic.play().catch(() => {}); }
                else { bgMusic.pause(); }
            });

            // Autoplay: browser mewajibkan interaksi pertama dari pengguna
            const gestureEvents = ['click', 'touchend', 'keydown'];
            const removeGestureListeners = () =>
                gestureEvents.forEach(ev => document.removeEventListener(ev, startAudio));
            function startAudio() {
                if (!bgMusic.paused) { removeGestureListeners(); return; }
                bgMusic.play().then(removeGestureListeners).catch(() => {});
            }
            gestureEvents.forEach(ev => document.addEventListener(ev, startAudio));

            // ---------- FULLSCREEN ----------
            const root = document.documentElement;
            const reqFs = root.requestFullscreen || root.webkitRequestFullscreen;
            const getFsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
            const syncFsIcon = () => {
                fullscreenBtn.innerHTML = getFsEl()
                    ? '<i class="fa-solid fa-compress"></i>'
                    : '<i class="fa-solid fa-expand"></i>';
            };
            if (!reqFs) {
                fullscreenBtn.style.display = 'none'; // mis. iPhone Safari tidak mendukung
            } else {
                fullscreenBtn.addEventListener('click', () => {
                    if (!getFsEl()) {
                        const p = reqFs.call(root);
                        if (p && p.catch) p.catch(() => {});
                    } else {
                        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                    }
                });
                document.addEventListener('fullscreenchange', syncFsIcon);
                document.addEventListener('webkitfullscreenchange', syncFsIcon);
            }

            // ---------- TOMBOL GANTI TAMPILAN ----------
            const updateViewBtn = () => {
                if (viewMode === 2) {
                    viewBtn.innerHTML = '<i class="fa-solid fa-file"></i>';
                    viewBtn.title = 'Tampilan 1 halaman';
                } else {
                    viewBtn.innerHTML = '<i class="fa-solid fa-book-open"></i>';
                    viewBtn.title = 'Tampilan 2 halaman';
                }
            };
            updateViewBtn();

            try {
                // ---------- LOAD PDF ----------
                const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
                totalPages = pdf.numPages;

                // Ukuran buku mengikuti rasio asli halaman PDF
                const firstPage = await pdf.getPage(1);
                const baseViewport = firstPage.getViewport({ scale: 1 });
                const pageW = 450;
                const pageH = Math.round(pageW * baseViewport.height / baseViewport.width);
                const pageRatio = pageW / pageH;

                // Buat semua halaman kosong dulu (canvas dirender saat dibutuhkan)
                const canvases = [];
                const pageEls = [];
                for (let i = 0; i < totalPages; i++) {
                    const canvas = document.createElement('canvas');
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    pageDiv.appendChild(canvas);
                    canvases.push(canvas);
                    pageEls.push(pageDiv);
                }

                // ---------- RENDER LAZY ----------
                const rendered = new Set();
                const rendering = new Set();
                let updateToken = 0;
                const pause = (ms) => new Promise(r => setTimeout(r, ms));

                const renderPage = async (idx) => {
                    if (rendered.has(idx) || rendering.has(idx)) return;
                    rendering.add(idx);
                    try {
                        const page = await pdf.getPage(idx + 1);
                        const base = page.getViewport({ scale: 1 });
                        const viewport = page.getViewport({ scale: TARGET_WIDTH / base.width });
                        const canvas = canvases[idx];
                        canvas.width = Math.floor(viewport.width);
                        canvas.height = Math.floor(viewport.height);
                        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                        rendered.add(idx);
                    } catch (err) {
                        console.error('Gagal render halaman', idx + 1, err);
                    } finally {
                        rendering.delete(idx);
                    }
                };

                const freePage = (idx) => {
                    canvases[idx].width = 0;
                    canvases[idx].height = 0;
                    rendered.delete(idx);
                };

                const updateVisiblePages = async (center) => {
                    const token = ++updateToken;
                    for (const i of [...rendered]) {
                        if (Math.abs(i - center) > KEEP_RADIUS) freePage(i);
                    }
                    const wanted = [center];
                    for (let d = 1; d <= RENDER_RADIUS; d++) wanted.push(center + d, center - d);
                    for (const i of wanted) {
                        if (token !== updateToken) return; // ada pembaruan yang lebih baru
                        if (i >= 0 && i < totalPages && !rendered.has(i)) {
                            await renderPage(i);
                            await pause(25); // beri napas supaya animasi tidak tersendat
                        }
                    }
                };

                let scheduleTimer;
                const scheduleUpdate = (center, delay = 250) => {
                    clearTimeout(scheduleTimer);
                    scheduleTimer = setTimeout(() => updateVisiblePages(center), delay);
                };

                // ---------- UKURAN BUKU (selalu muat di layar) ----------
                let builtWidth = 0;

                const computeBookWidth = () => {
                    const padTop = 10;
                    const padBottom = window.innerHeight < 500 ? 52 : 78;
                    root.style.setProperty('--pad-top', padTop + 'px');
                    root.style.setProperty('--pad-bottom', padBottom + 'px');

                    const across = viewMode === 2 ? 2 : 1;
                    const availW = window.innerWidth * 0.96;
                    const availH = window.innerHeight - padTop - padBottom;
                    const maxW = viewMode === 2 ? MAX_BOOK_WIDTH_TWO : MAX_BOOK_WIDTH_ONE;
                    return Math.max(120, Math.floor(Math.min(availW, availH * pageRatio * across, maxW)));
                };

                const currentIdx = () => {
                    try { return pageFlip ? pageFlip.getCurrentPageIndex() : 0; } catch (e) { return 0; }
                };

                // ---------- BANGUN BUKU ----------
                const buildBook = (startIdx) => {
                    const w = computeBookWidth();
                    builtWidth = w;
                    bookWrapper.style.width = w + 'px';

                    // Bongkar buku lama (jika ada)
                    if (pageFlip) {
                        try { pageFlip.destroy(); } catch (e) {}
                        pageFlip = null;
                    }
                    if (flipbookEl && flipbookEl.parentNode) flipbookEl.remove();

                    // Wadah baru
                    flipbookEl = document.createElement('div');
                    flipbookEl.id = 'flipbook';
                    bookWrapper.appendChild(flipbookEl);

                    // Reset halaman supaya bersih sebelum dimuat lagi
                    pageEls.forEach(el => { el.className = 'page'; el.removeAttribute('style'); });

                    const single = viewMode === 1;
                    pageFlip = new St.PageFlip(flipbookEl, {
                        width: pageW, height: pageH, size: 'stretch',
                        // minWidth kecil agar wadah tidak dipaksa lebih lebar dari layar HP.
                        // Mode 1 halaman: minWidth*2 > lebar buku => library otomatis tampil 1 halaman.
                        minWidth: single ? Math.ceil(w * 0.6) : 60,
                        maxWidth: 1000,
                        minHeight: 80, maxHeight: 1600,
                        showCover: true,
                        usePortrait: single,
                        startPage: startIdx,
                        mobileScrollSupport: false,
                        flippingTime: 600,
                        maxShadowOpacity: 0.35,
                        showPageCorners: !IS_TOUCH
                    });
                    pageFlip.loadFromHTML(pageEls);

                    pageSlider.max = totalPages;
                    pageSlider.value = startIdx + 1;

                    pageFlip.on('flip', (e) => {
                        const currentPage = e.data + 1;
                        pageSlider.value = currentPage;
                        updateTooltip(currentPage);
                        scheduleUpdate(e.data);
                        playFlipSound();
                    });

                    applyZoom();
                    requestAnimationFrame(applyZoom);
                    scheduleUpdate(startIdx, 50);
                };

                // Render halaman awal sebelum buku ditampilkan
                await updateVisiblePages(0);

                // Transisi loading -> buku
                setTimeout(() => {
                    welcomeScreen.style.opacity = 0;
                    setTimeout(() => {
                        welcomeScreen.style.display = 'none';
                        bookWrapper.style.display = 'block';
                        buildBook(0);

                        navLeft.style.display = 'flex';
                        navRight.style.display = 'flex';
                        bottomBar.style.display = 'flex';
                        topTools.style.display = 'flex';
                    }, 1000);
                }, 1200);

                // ---------- EVENT ----------
                viewBtn.addEventListener('click', () => {
                    if (!pageFlip) return;
                    viewMode = viewMode === 2 ? 1 : 2;
                    try { localStorage.setItem('bukang_view_mode', String(viewMode)); } catch (e) {}
                    updateViewBtn();
                    buildBook(currentIdx());
                });

                zoomInBtn.addEventListener('click', () => {
                    if (currentZoom < 3) { currentZoom += 0.5; applyZoom(); }
                });
                zoomOutBtn.addEventListener('click', () => {
                    if (currentZoom > 1) { currentZoom -= 0.5; applyZoom(); }
                });

                navLeft.addEventListener('click', () => { if (pageFlip) pageFlip.flipPrev(); });
                navRight.addEventListener('click', () => { if (pageFlip) pageFlip.flipNext(); });

                document.addEventListener('keydown', (e) => {
                    if (!pageFlip) return;
                    if (e.key === 'ArrowLeft') pageFlip.flipPrev();
                    if (e.key === 'ArrowRight') pageFlip.flipNext();
                });

                pageSlider.addEventListener('input', (e) => {
                    if (!pageFlip) return;
                    const pageNum = parseInt(e.target.value, 10);
                    pageFlip.turnToPage(pageNum - 1);
                    updateTooltip(pageNum);
                    scheduleUpdate(pageNum - 1, 150);
                    playFlipSound();
                });

                // Ukuran ulang (putar layar, fullscreen, dll.): bangun ulang buku hanya jika ukurannya benar-benar berubah
                let resizeTimer;
                const onResize = () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => {
                        if (!pageFlip) return;
                        if (Math.abs(computeBookWidth() - builtWidth) > 2) buildBook(currentIdx());
                        else applyZoom();
                    }, 250);
                };
                window.addEventListener('resize', onResize);
                window.addEventListener('orientationchange', onResize);

            } catch (error) {
                welcomeScreen.innerHTML = '<div style="color: #e74c3c; font-weight: bold; text-align:center; padding: 20px;">PDF gagal dimuat. Pastikan file tersedia.</div>';
                console.error(error);
            }
        });

        // ---------- REGISTRASI PWA ----------
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('PWA aktif!', reg.scope))
                    .catch(err => console.log('PWA gagal: ', err));
            });
        }
    </script>
</body>
</html>
