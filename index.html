<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Angkatan Ksatiara 12</title>
    <style>
        /* Latar belakang elegan bergaya meja/ruang gelap agar buku lebih menonjol */
        body {
            background-color: #2c3e50;
            background-image: radial-gradient(circle, #34495e 0%, #1a252f 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden; color: #ecf0f1;
        }
        
        .title-container { text-align: center; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .title-container h1 { margin-bottom: 5px; letter-spacing: 1px; color: #fdfaf6; }
        .title-container p { font-style: italic; color: #bdc3c7; }
        
        #loading { 
            font-size: 18px; font-weight: bold; margin-top: 20px; 
            background: rgba(0,0,0,0.4); padding: 10px 20px; border-radius: 8px; 
        }
        
        #start-btn {
            padding: 15px 30px; font-size: 20px; font-weight: bold; cursor: pointer;
            background-color: #e74c3c; color: white; border: none; border-radius: 8px; display: none;
            transition: 0.3s; box-shadow: 0 4px 15px rgba(231,76,60,0.4);
        }
        #start-btn:hover { background-color: #c0392b; transform: translateY(-3px); box-shadow: 0 6px 20px rgba(231,76,60,0.6); }
        
        /* --- WRAPPER BUKU & PENGATURAN MODE HALAMAN --- */
        #book-wrapper { 
            display: none; 
            margin-top: 20px; 
            width: 90vw; 
            max-width: 950px; 
            transition: max-width 0.4s ease-in-out;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
        }
        #book-wrapper.single-mode { max-width: 450px; }
        
        /* --- EFEK BUKU REALISTIS --- */
        .page { 
            background-color: #fdfaf6; 
            border: 1px solid #999; 
            cursor: grab; 
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .page:active { cursor: grabbing; }
        
        canvas { width: 100%; height: 100%; object-fit: fill; }
        
        .stf__item.--left .page { box-shadow: inset -15px 0 30px rgba(0,0,0,0.15) !important; }
        .stf__item.--right .page { box-shadow: inset 15px 0 30px rgba(0,0,0,0.15) !important; }
        .stf__item.--flipping .page { box-shadow: inset 0 0 20px rgba(0,0,0,0.2) !important; }

        /* --- KONTROL TOMBOL --- */
        .controls { display: none; margin-top: 30px; gap: 10px; flex-wrap: wrap; justify-content: center; padding-bottom: 40px; }
        .controls button { 
            padding: 10px 18px; border: none; border-radius: 6px; 
            background: rgba(255,255,255,0.1); color: white; cursor: pointer; font-weight: bold;
            border: 1px solid rgba(255,255,255,0.3); backdrop-filter: blur(5px);
            transition: 0.2s;
        }
        .controls button:hover { background: rgba(255,255,255,0.25); transform: translateY(-2px); }
        
        #layout-toggle { background: #2980b9; border-color: #2980b9; }
        #layout-toggle:hover { background: #1a5276; }
        #music-btn { background: #d35400; border-color: #d35400; }
        #music-btn:hover { background: #a04000; }
    </style>
</head>
<body>

    <div class="title-container" id="main-title">
        <h1>Buku Angkatan Ksatiara 12</h1>
        <p>Selamat datang di mesin waktu kita!</p>
    </div>

    <div id="loading">Memuat Mesin Waktu (PDF)... ⏳ Mohon tunggu sebentar.</div>
    
    <button id="start-btn">📖 Buka Buku & Putar Lagu Kenangan</button>

    <div id="book-wrapper">
        <div id="flipbook"></div>
    </div>

    <div class="controls" id="controls">
        <button id="prev-btn">⬅️ Balik Kiri</button>
        <button id="layout-toggle">📄 Tampilan: 2 Halaman</button>
        <button id="music-btn">⏸️ Pause Musik</button>
        <button id="next-btn">Balik Kanan ➡️</button>
    </div>

    <!-- AUDIO PLAYER DIPERBARUI KE music.mp3.mp3 -->
    <audio id="bg-music" src="music.mp3.mp3" loop preload="auto"></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
            const pdfUrl = 'bukang_compressed.pdf'; 

            const loadingDiv = document.getElementById('loading');
            const startBtn = document.getElementById('start-btn');
            const flipbookEl = document.getElementById('flipbook');
            const bookWrapper = document.getElementById('book-wrapper');
            const controls = document.getElementById('controls');
            const bgMusic = document.getElementById('bg-music');
            const layoutToggleBtn = document.getElementById('layout-toggle');

            bgMusic.volume = 0.5;
            let isSingleMode = false; 
            let pageFlip; 

            try {
                const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
                const totalPages = pdf.numPages;

                for (let i = 1; i <= totalPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 1.5 }); 

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;

                    await page.render({ canvasContext: context, viewport: viewport }).promise;

                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    pageDiv.appendChild(canvas);
                    flipbookEl.appendChild(pageDiv);
                }

                loadingDiv.style.display = 'none';
                startBtn.style.display = 'inline-block';

                pageFlip = new St.PageFlip(flipbookEl, {
                    width: 450, 
                    height: 636, 
                    size: "stretch",
                    minWidth: 315,
                    maxWidth: 1000,
                    minHeight: 420,
                    maxHeight: 1350,
                    showCover: true, 
                    mobileScrollSupport: false 
                });

                startBtn.addEventListener('click', () => {
                    startBtn.style.display = 'none';
                    document.getElementById('main-title').style.display = 'none';
                    
                    bookWrapper.style.display = 'block';
                    controls.style.display = 'flex';

                    pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                    bgMusic.play().catch(function(error) {
                        console.log("Musik error: ", error);
                        alert("Ups, musik gagal diputar. Pastikan file 'music.mp3.mp3' ter-upload dengan benar.");
                    });
                });

                layoutToggleBtn.addEventListener('click', () => {
                    isSingleMode = !isSingleMode;
                    
                    if (isSingleMode) {
                        bookWrapper.classList.add('single-mode');
                        layoutToggleBtn.innerText = '📖 Tampilan: 1 Halaman';
                    } else {
                        bookWrapper.classList.remove('single-mode');
                        layoutToggleBtn.innerText = '📄 Tampilan: 2 Halaman';
                    }

                    setTimeout(() => { window.dispatchEvent(new Event('resize')); }, 100);
                    setTimeout(() => { window.dispatchEvent(new Event('resize')); pageFlip.update(); }, 400);
                });

                document.getElementById('prev-btn').addEventListener('click', () => pageFlip.flipPrev());
                document.getElementById('next-btn').addEventListener('click', () => pageFlip.flipNext());
                
                document.getElementById('music-btn').addEventListener('click', (e) => {
                    if (bgMusic.paused) { 
                        bgMusic.play().catch(console.error); 
                        e.target.innerText = '⏸️ Pause Musik';
                    } else { 
                        bgMusic.pause(); 
                        e.target.innerText = '▶️ Putar Musik';
                    }
                });

            } catch (error) {
                loadingDiv.innerText = '❌ Gagal memuat buku PDF.';
                console.error(error);
            }
        });
    </script>
</body>
</html>
