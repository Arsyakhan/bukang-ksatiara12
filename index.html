<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#e3f2fd">
    <link rel="apple-touch-icon" href="logo_ksatiara.png">
    
    <title>Buku Angkatan Ksatiara 12</title>
    <!-- Library Icon FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Font Friendly: Nunito -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- TEMA DASAR --- */
        body {
            background: linear-gradient(135deg, #e3f2fd 0%, #fff9c4 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 50px 0; 
            font-family: 'Nunito', sans-serif;
            /* Diubah menjadi auto agar bisa digeser saat buku di-zoom */
            overflow: auto; 
            color: #2c3e50;
            overscroll-behavior: contain;
        }
        
        /* --- LOADING SCREEN --- */
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #e3f2fd 0%, #fff9c4 100%);
            z-index: 9999;
            transition: opacity 1s ease-in-out;
        }

        #loading-logo {
            width: 150px; 
            animation: pulse-logo 2s infinite ease-in-out;
        }

        @keyframes pulse-logo {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(25, 118, 210, 0.2)); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 25px rgba(25, 118, 210, 0.6)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(25, 118, 210, 0.2)); }
        }

        /* --- BUKU --- */
        #book-wrapper { 
            display: none; width: 95vw; max-width: 1000px; 
            transition: transform 0.4s ease;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15); 
            border-radius: 5px;
            z-index: 10;
        }
        
        .page { 
            background-color: #ffffff; border: 1px solid #e0e0e0; 
            cursor: grab; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .page:active { cursor: grabbing; }
        canvas { width: 100%; height: 100%; object-fit: fill; }
        
        .stf__item.--left .page { box-shadow: inset -15px 0 30px rgba(0,0,0,0.04) !important; }
        .stf__item.--right .page { box-shadow: inset 15px 0 30px rgba(0,0,0,0.04) !important; }
        .stf__item.--flipping .page { box-shadow: inset 0 0 20px rgba(0,0,0,0.1) !important; }

        /* --- UI MINIMALIS: PANAH KIRI & KANAN (Position Fixed agar tetap melayang) --- */
        .side-nav {
            position: fixed; top: 50%; transform: translateY(-50%);
            width: 45px; height: 45px; border-radius: 50%;
            background-color: #e74c3c; 
            color: white; border: none; font-size: 18px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 100;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
            transition: all 0.2s; opacity: 0.8;
            display: none; 
        }
        .side-nav:hover { opacity: 1; transform: translateY(-50%) scale(1.1); }
        #nav-left { left: 2vw; }
        #nav-right { right: 2vw; }

        /* --- UI MINIMALIS: SLIDER BAWAH --- */
        #bottom-bar {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 400px;
            display: none; flex-direction: column; align-items: center;
            z-index: 100;
        }

        #page-tooltip {
            background-color: rgba(99, 110, 114, 0.9); color: white;
            padding: 4px 12px; border-radius: 12px; font-size: 14px; font-weight: 700;
            margin-bottom: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            pointer-events: none; transition: 0.1s ease-out;
            opacity: 0; 
        }

        #page-slider {
            width: 100%; -webkit-appearance: none; appearance: none;
            height: 6px; background: rgba(45, 52, 54, 0.2);
            border-radius: 10px; outline: none; cursor: pointer;
        }

        #page-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 18px; height: 18px; border-radius: 50%;
            background: #2d3436; cursor: pointer; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        #page-slider::-webkit-slider-thumb:hover { transform: scale(1.3); }

        /* --- MINI FLOATING MENU (Pojok atas dengan tambahan tombol Zoom) --- */
        #top-tools {
            position: fixed; top: 15px; right: 15px;
            display: none; gap: 10px; z-index: 100;
        }
        .mini-btn {
            width: 35px; height: 35px; border-radius: 50%; border: none;
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(5px);
            color: #2d3436; cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: 0.2s; font-size: 14px;
        }
        .mini-btn:hover { background: white; transform: scale(1.1); }
        #music-btn.playing { color: #e74c3c; }
    </style>
</head>
<body>

    <!-- SCREEN LOADING -->
    <div id="welcome-screen">
        <img src="logo_ksatiara.png" alt="Logo" id="loading-logo" onerror="this.src='logo_rk.png'">
    </div>

    <!-- WADAH BUKU UTAMA -->
    <div id="book-wrapper">
        <div id="flipbook"></div>
    </div>

    <!-- TOMBOL NAVIGASI SAMPING -->
    <button class="side-nav" id="nav-left"><i class="fa-solid fa-chevron-left"></i></button>
    <button class="side-nav" id="nav-right"><i class="fa-solid fa-chevron-right"></i></button>

    <!-- SLIDER MINIMALIS BAWAH -->
    <div id="bottom-bar">
        <div id="page-tooltip">1</div>
        <input type="range" id="page-slider" min="1" max="1" value="1">
    </div>

    <!-- TOMBOL KECIL POJOK KANAN ATAS (Sekarang dilengkapi fitur Zoom) -->
    <div id="top-tools">
        <!-- Tombol Zoom -->
        <button class="mini-btn" id="zoom-out-btn" title="Perkecil"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
        <button class="mini-btn" id="zoom-in-btn" title="Perbesar"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
        <!-- Tombol Layar Penuh & Musik -->
        <button class="mini-btn" id="fullscreen-btn"><i class="fa-solid fa-expand"></i></button>
        <button class="mini-btn playing" id="music-btn"><i class="fa-solid fa-pause"></i></button>
    </div>

    <!-- AUDIO FILES -->
    <audio id="bg-music" src="music.mp3.mp3" loop preload="auto"></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
            const pdfUrl = 'bukang_compressed.pdf'; 

            const welcomeScreen = document.getElementById('welcome-screen');
            const bookWrapper = document.getElementById('book-wrapper');
            const flipbookEl = document.getElementById('flipbook');
            
            const navLeft = document.getElementById('nav-left');
            const navRight = document.getElementById('nav-right');
            const bottomBar = document.getElementById('bottom-bar');
            const topTools = document.getElementById('top-tools');
            const pageSlider = document.getElementById('page-slider');
            const pageTooltip = document.getElementById('page-tooltip');
            
            const zoomInBtn = document.getElementById('zoom-in-btn');
            const zoomOutBtn = document.getElementById('zoom-out-btn');
            const musicBtn = document.getElementById('music-btn');
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            
            const bgMusic = document.getElementById('bg-music');
            
            bgMusic.volume = 0.5;
            
            let pageFlip; 
            let totalPages = 0;
            let tooltipTimeout;
            let currentZoom = 1;

            const playFlipSound = () => {
                const sound = new Audio('flip.mp3');
                sound.volume = 1.0;
                sound.play().catch(()=>{});
            };

            const updateTooltip = (val) => {
                pageTooltip.innerText = val;
                pageTooltip.style.opacity = 1;
                
                clearTimeout(tooltipTimeout);
                tooltipTimeout = setTimeout(() => { pageTooltip.style.opacity = 0; }, 1500);
            };

            // FUNGSI ZOOM
            const applyZoom = () => {
                bookWrapper.style.transform = `scale(${currentZoom})`;
                bookWrapper.style.transformOrigin = 'top center'; 
                
                // Menyesuaikan margin agar halaman bisa discroll ke bawah saat diperbesar
                if (currentZoom > 1) {
                    const extraHeight = bookWrapper.offsetHeight * (currentZoom - 1);
                    bookWrapper.style.marginBottom = `${extraHeight + 50}px`;
                } else {
                    bookWrapper.style.marginBottom = '0px';
                }
            };

            try {
                const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
                totalPages = pdf.numPages;

                for (let i = 1; i <= totalPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 1.5 }); 
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = viewport.width; canvas.height = viewport.height;
                    await page.render({ canvasContext: context, viewport: viewport }).promise;

                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    pageDiv.appendChild(canvas);
                    flipbookEl.appendChild(pageDiv);
                }

                pageFlip = new St.PageFlip(flipbookEl, {
                    width: 450, height: 636, size: "stretch",
                    minWidth: 315, maxWidth: 1000, minHeight: 420, maxHeight: 1350,
                    showCover: true, mobileScrollSupport: false, usePortrait: false 
                });

                setTimeout(() => {
                    welcomeScreen.style.opacity = 0;
                    
                    setTimeout(() => {
                        welcomeScreen.style.display = 'none';
                        bookWrapper.style.display = 'block';
                        
                        pageFlip.loadFromHTML(document.querySelectorAll('.page'));
                        pageSlider.max = totalPages;
                        
                        navLeft.style.display = 'flex';
                        navRight.style.display = 'flex';
                        bottomBar.style.display = 'flex';
                        topTools.style.display = 'flex';
                        
                    }, 1000); 
                }, 1500); 

                const startAudio = () => {
                    if (bgMusic.paused) { bgMusic.play().catch(()=>{}); }
                };
                document.body.addEventListener('click', startAudio, { once: true });
                document.body.addEventListener('touchstart', startAudio, { once: true });

                // EVENT ZOOM
                zoomInBtn.addEventListener('click', () => { 
                    if (currentZoom < 3) { currentZoom += 0.5; applyZoom(); } 
                });
                zoomOutBtn.addEventListener('click', () => { 
                    if (currentZoom > 1) { currentZoom -= 0.5; applyZoom(); } 
                });

                // NAVIGASI
                navLeft.addEventListener('click', () => pageFlip.flipPrev());
                navRight.addEventListener('click', () => pageFlip.flipNext());

                pageSlider.addEventListener('input', (e) => {
                    const pageNum = parseInt(e.target.value, 10);
                    pageFlip.turnToPage(pageNum - 1); 
                    updateTooltip(pageNum);
                    playFlipSound(); 
                });

                pageFlip.on('flip', (e) => {
                    const currentPage = e.data + 1;
                    pageSlider.value = currentPage;
                    updateTooltip(currentPage);
                    playFlipSound();
                });

                fullscreenBtn.addEventListener('click', () => {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(()=>{});
                        fullscreenBtn.innerHTML = '<i class="fa-solid fa-compress"></i>';
                    } else {
                        document.exitFullscreen();
                        fullscreenBtn.innerHTML = '<i class="fa-solid fa-expand"></i>';
                    }
                });

                musicBtn.addEventListener('click', () => {
                    if (bgMusic.paused) { 
                        bgMusic.play().catch(()=>{}); 
                        musicBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                        musicBtn.classList.add('playing');
                    } else { 
                        bgMusic.pause(); 
                        musicBtn.innerHTML = '<i class="fa-solid fa-music"></i>';
                        musicBtn.classList.remove('playing');
                    }
                });

            } catch (error) {
                welcomeScreen.innerHTML = '<div style="color: #e74c3c; font-weight: bold;">PDF Gagal Dimuat. Pastikan file tersedia.</div>';
                console.error(error);
            }
        });
    </script>
</body>
</html>
